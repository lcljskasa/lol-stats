<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>战绩速览 · 悬浮窗</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #1b1b20; --card: #232329; --line: rgba(255, 255, 255, .07); --line-2: rgba(255, 255, 255, .12);
  --text: #ffffff; --text-2: #b8b8c6; --text-3: #7d7c8f;
  --gold: #8b6dff; --gold-hi: #e6e0ff; --gold-lo: #4a3c9a;
  --win: #5383e8; --loss: #e84057; --ok: #00bba3;
  --num: "Bahnschrift", "DIN Alternate", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body { font: 12px/1.45 "Microsoft YaHei UI", "Segoe UI", sans-serif; user-select: none; -webkit-font-smoothing: antialiased;
       border: 1px solid var(--line-2); border-radius: 0; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { display: block; }
.c-good { color: var(--win); } .c-bad { color: var(--loss); } .c-dim { color: var(--text-3); } .c-ok { color: var(--ok); }

.bar { height: 50px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; border-bottom: 1px solid var(--line);
       background: #17171b; }
.mark { width: 12px; height: 12px; transform: rotate(45deg); border: 1.5px solid var(--gold); border-radius: 2px; flex: none; }
.title { font-size: 12px; font-weight: 600; color: var(--gold-hi); letter-spacing: .08em; }
.time { font: 600 13px var(--num); color: var(--text-2); }
.diffchip { font: 600 12px var(--num); padding: 2px 8px; border-radius: 999px; background: rgba(255, 255, 255, .05); }
.grow { flex: 1; align-self: stretch; }
.ibtn { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--text-2); }
.ibtn:hover { background: rgba(255, 255, 255, .08); color: var(--text); }
.ibtn svg { width: 11px; height: 11px; }

main { height: calc(100% - 50px); overflow-y: auto; padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 10px; }
main::-webkit-scrollbar { width: 6px; } main::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .1); border-radius: 6px; }
.sec { background: var(--card); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; flex: none; }
.sec h3 { font-size: 12px; font-weight: 600; color: var(--gold-hi); margin-bottom: 8px; display: flex; align-items: baseline; gap: 6px; }
.sec h3 span { font-weight: 400; font-size: 11px; color: var(--text-3); }
.sec h3 em { margin-left: auto; font-style: normal; font: 600 12px var(--num); }

/* 经济 */
.eco { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; }
.eco .side b { display: block; font: 700 20px var(--num); line-height: 1.1; }
.eco .side span { font-size: 11px; color: var(--text-3); }
.eco .side.r { text-align: right; }
.eco .vs { font: 600 11px var(--num); color: var(--text-3); padding-bottom: 4px; }
.ecobar { display: flex; height: 6px; border-radius: 6px; overflow: hidden; margin-top: 8px; background: var(--line); }
.ecobar .m { background: var(--win); } .ecobar .e { background: var(--loss); flex: 1; }
.eco-sub { display: flex; justify-content: space-between; margin-top: 5px; font-size: 11px; color: var(--text-3); }

/* 出装 */
.build { display: flex; gap: 6px; align-items: flex-start; }
.it { position: relative; width: 40px; text-align: center; }
.it img, .it .ph { width: 40px; height: 40px; border-radius: 8px; background: #2c2c33; border: 1px solid var(--line); }
.it.own img { opacity: .45; filter: grayscale(.6); }
.it.own::after { content: "✓"; position: absolute; top: 9px; left: 0; right: 0; font: 700 18px var(--num); color: var(--ok); text-shadow: 0 0 6px #000; }
.it.next img { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 12px rgba(200, 170, 110, .45); }
.it small { display: block; font: 600 10px var(--num); color: var(--text-3); margin-top: 3px; }
.it.next small { color: var(--gold); }
.arrow { color: var(--text-3); align-self: center; margin-top: -14px; }
.nextline { margin-top: 8px; font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.nextline b { font: 600 13px var(--num); }

/* 技能 */
.sk { display: flex; align-items: center; gap: 10px; }
.ab { position: relative; width: 44px; height: 44px; flex: none; }
.ab img { width: 44px; height: 44px; border-radius: 9px; border: 1px solid var(--gold); box-shadow: 0 0 14px rgba(200, 170, 110, .35); }
.ab b { position: absolute; right: -4px; bottom: -4px; min-width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center;
        font: 700 11px var(--num); color: #0b0f14; background: var(--gold); }
.sk .txt { font-size: 12px; color: var(--text-2); }
.sk .txt b { display: block; font-size: 14px; color: var(--text); }
.strip { display: grid; grid-template-columns: repeat(15, 1fr); gap: 2px; margin-top: 9px; }
.strip i { font-style: normal; height: 18px; border-radius: 4px; display: grid; place-items: center; font: 700 10px var(--num); color: #0b0f14; }
.strip i.Q { background: #5aa9ff; } .strip i.W { background: #4fd1c5; } .strip i.E { background: #d9b56b; } .strip i.R { background: #ff6e6e; }
.strip i.done { opacity: .25; }
.strip i.cur { outline: 2px solid #fff; outline-offset: 1px; }

/* 提醒 */
.row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row + .row { margin-top: 7px; }
.ch { position: relative; width: 30px; height: 30px; }
.ch img, .ch .ph { width: 30px; height: 30px; border-radius: 7px; background: #2c2c33; }
.ch.dead img { filter: grayscale(1) brightness(.5); }
.ch i { position: absolute; right: -4px; bottom: -4px; font: 700 10px var(--num); font-style: normal; background: #000; color: var(--text);
        border: 1px solid var(--line-2); border-radius: 5px; padding: 0 4px; }
.mini img { width: 22px; height: 22px; border-radius: 5px; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: rgba(255, 255, 255, .05); color: var(--text-2); }
.alert { margin-top: 8px; padding: 7px 9px; border-radius: 8px; font-size: 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.alert.bad { background: rgba(255, 93, 108, .1); color: #ffb3ba; }
.alert.ok { background: rgba(61, 220, 151, .08); color: #9ff0c9; }
.lbl { font-size: 11px; color: var(--text-3); width: 100%; }

.wait { height: 100%; display: grid; place-items: center; text-align: center; color: var(--text-3); padding: 20px; }
.wait b { display: block; color: var(--gold-hi); font-size: 14px; margin-bottom: 6px; }
.collapsed main { display: none; }
</style>
</head>
<body>
<div class="bar pywebview-drag-region">
  <div class="mark pywebview-drag-region"></div>
  <span class="title pywebview-drag-region">战绩速览</span>
  <span class="time pywebview-drag-region" id="time"></span>
  <span class="diffchip pywebview-drag-region" id="diff" style="display:none"></span>
  <div class="grow pywebview-drag-region"></div>
  <button class="ibtn" id="fold" title="折叠 / 展开"><svg viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1.4"/></svg></button>
  <button class="ibtn" id="close" title="本局不再显示"><svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="currentColor" stroke-width="1.4"/></svg></button>
</div>
<main id="main"><div class="wait"><div><b>等待对局开始</b>进入游戏后这里会显示经济、出装和提醒</div></div></main>

<script>
const TOKEN = "__APP_TOKEN__";
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { "X-App-Token": TOKEN } });
const getJSON = async p => { const r = await api(p); const d = await r.json(); if (!r.ok || d.error) throw new Error(d.error || r.status); return d; };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const POS = { top: "上单", jungle: "打野", middle: "中单", bottom: "ADC", utility: "辅助" };
const GRIEVOUS_AD = 3123, GRIEVOUS_AP = 3916;   // 推荐的便宜重伤：死刑宣告 / 湮灭宝珠

let assets = { champions: {}, items: {}, prices: {} }, live = null, build = null, buildKey = null, collapsed = false;
const otier = (() => { try { return JSON.parse(localStorage.getItem("otier")) || "emerald_plus"; } catch (e) { return "emerald_plus"; } })();

const img = (kind, id, title = "") => id ? `<img src="/art/${kind}/${id}" alt="" title="${esc(title)}" onerror="this.style.visibility='hidden'">` : '<div class="ph"></div>';
const item = id => img("item", id, assets.items[id]);
const champ = id => img("square", id, assets.champions[id]);
const k = n => (n / 1000).toFixed(1) + "k";
const mmss = t => `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;

async function loadBuild() {
  const me = live?.me;
  if (!me?.champ) return;
  const mode = live.mode === "ARAM" ? "aram" : "ranked";
  const key = [me.champ, me.pos, mode].join("|");
  if (key === buildKey) return;
  buildKey = key;
  try {
    const q = new URLSearchParams({ champ: me.champ, mode, tier: otier });
    if (me.pos && mode === "ranked") q.set("pos", me.pos);
    build = await getJSON("/api/opgg/build?" + q);
  } catch (e) { build = { error: e.message }; }
  render();
}

function ecoSec(d) {
  const m = d.value.mine, e = d.value.enemy, diff = m - e;
  return `<div class="sec"><h3>装备经济 <span>双方装备总价</span><em class="${diff >= 0 ? "c-good" : "c-bad"}">${diff >= 0 ? "+" : ""}${k(diff)}</em></h3>
    <div class="eco"><div class="side"><b class="c-good">${k(m)}</b><span>我方 · 击杀 ${d.kills.mine}</span></div><div class="vs">VS</div>
      <div class="side r"><b class="c-bad">${k(e)}</b><span>击杀 ${d.kills.enemy} · 敌方</span></div></div>
    <div class="ecobar"><div class="m" style="width:${m / Math.max(m + e, 1) * 100}%"></div><div class="e"></div></div>
    <div class="eco-sub"><span>我身上 <b class="num" style="color:var(--gold)">${d.gold}</b> 金币</span><span>${d.me?.pos ? POS[d.me.pos] : ""}</span></div></div>`;
}

function buildSec(d) {
  if (!build) return `<div class="sec"><h3>推荐出装</h3><span class="c-dim">读取 OP.GG 数据…</span></div>`;
  if (build.error) return `<div class="sec"><h3>推荐出装</h3><span class="c-dim">读取失败：${esc(build.error)}</span></div>`;
  const own = new Set(d.me.items);
  const core = build.core?.[0]?.ids || [];
  const boots = build.boots?.[0]?.ids?.[0];
  const seq = [...core]; if (boots && !seq.includes(boots)) seq.splice(1, 0, boots);
  const next = seq.find(id => !own.has(id));
  const cells = seq.map((id, i) => `${i ? '<span class="arrow">›</span>' : ""}<div class="it${own.has(id) ? " own" : ""}${id === next ? " next" : ""}">${item(id)}
      <small>${own.has(id) ? "已有" : id === next ? "下一件" : (assets.prices[id] || "")}</small></div>`).join("");
  const price = next ? assets.prices[next] || 0 : 0;
  const lack = price - d.gold;
  return `<div class="sec"><h3>推荐出装 <span>${esc(assets.champions[d.me.champ] || "")} · OP.GG</span></h3>
    <div class="build">${cells}</div>
    ${next ? `<div class="nextline">下一件 ${esc(assets.items[next] || "")} <b class="${lack <= 0 ? "c-ok" : ""}">${lack <= 0 ? "钱够了，回家买！" : "还差 " + lack + " 金币"}</b></div>`
           : '<div class="nextline c-ok">核心装备已成型</div>'}</div>`;
}

function skillSec(d) {
  const s = build?.skills;
  if (!s?.order) return "";
  const lv = d.abilities || {}, spent = (lv.Q || 0) + (lv.W || 0) + (lv.E || 0) + (lv.R || 0);
  // 按推荐顺序，找到下一个还没加的点
  const cnt = { Q: 0, W: 0, E: 0, R: 0 };
  let nextIdx = -1;
  s.order.forEach((key, i) => { cnt[key]++; if (nextIdx < 0 && cnt[key] > (lv[key] || 0)) nextIdx = i; });
  const nextKey = nextIdx >= 0 ? s.order[nextIdx] : null;
  const canLevel = d.level > spent;
  const strip = s.order.slice(0, 15).map((key, i) => `<i class="${key}${i < spent ? " done" : ""}${i === nextIdx ? " cur" : ""}">${key}</i>`).join("");
  return `<div class="sec"><h3>技能加点 <span>主升 ${(s.priority || []).join(" › ")}</span></h3>
    ${nextKey ? `<div class="sk"><div class="ab"><img src="/art/ability/${d.me.champ}/${nextKey.toLowerCase()}" alt="" onerror="this.style.visibility='hidden'"><b>${nextKey}</b></div>
      <div class="txt"><b>${canLevel ? "现在升 " + nextKey : "下一级升 " + nextKey}</b>${canLevel ? `有 ${d.level - spent} 个技能点没加` : `当前 ${d.level} 级`}</div></div>` : ""}
    <div class="strip">${strip}</div></div>`;
}

function alertSec(d) {
  const heal = d.enemyHeal || [], grv = d.myGrievous || [];
  const healHtml = heal.length ? heal.map(h => `<div class="row"><div class="ch">${champ(h.champ)}</div>
      <span class="mini row">${h.items.map(item).join("")}</span>${h.kit ? '<span class="tag">技能自带回复</span>' : ""}</div>`).join("")
    : '<span class="c-dim">敌方暂时没有明显的治疗来源</span>';
  let tip;
  if (heal.length >= 2 && !grv.length) tip = `<div class="alert bad">⚠ 敌方 ${heal.length} 人有治疗，我方还没有重伤装。可以考虑
      <span class="mini row">${item(GRIEVOUS_AD)}${item(GRIEVOUS_AP)}</span></div>`;
  else if (grv.length) tip = `<div class="alert ok">我方重伤：${grv.map(g => `<span class="mini row">${champ(g.champ)}${g.items.map(item).join("")}</span>`).join(" ")}</div>`;
  else tip = "";
  return `<div class="sec"><h3>治疗与重伤</h3>${healHtml}${tip}</div>`;
}

function wardSec(d) {
  const total = d.mine.reduce((a, p) => a + p.controlWards, 0);
  return `<div class="sec"><h3>控制守卫 <span>我方身上共 ${total} 个 · 数字是视野分</span></h3>
    <div class="row">${d.mine.map(p => `<div style="text-align:center"><div class="ch">${champ(p.champ)}<i>${p.controlWards}</i></div>
      <small class="num c-dim">${p.ward}</small></div>`).join("")}</div>
    ${d.enemy.some(p => p.dead) ? `<div class="row" style="margin-top:8px"><span class="lbl">敌方阵亡</span>${d.enemy.filter(p => p.dead).map(p =>
      `<div class="ch dead">${champ(p.champ)}<i>${p.respawn}s</i></div>`).join("")}</div>` : ""}</div>`;
}

function render() {
  document.body.classList.toggle("collapsed", collapsed);
  const d = live;
  if (!d?.active) {
    $("#time").textContent = ""; $("#diff").style.display = "none";
    $("#main").innerHTML = '<div class="wait"><div><b>等待对局开始</b>进入游戏后这里会显示经济、出装和提醒</div></div>';
    return;
  }
  $("#time").textContent = mmss(d.time);
  const diff = d.value.mine - d.value.enemy;
  $("#diff").style.display = "";
  $("#diff").className = "diffchip " + (diff >= 0 ? "c-good" : "c-bad");
  $("#diff").textContent = (diff >= 0 ? "+" : "") + k(diff);
  const top = $("#main").scrollTop;
  $("#main").innerHTML = ecoSec(d) + buildSec(d) + skillSec(d) + alertSec(d) + wardSec(d);
  $("#main").scrollTop = top;
}

async function poll() {
  try {
    live = await getJSON("/api/live");
    collapsed = !!live.collapsed;
    if (live.active && !Object.keys(assets.champions).length) assets = await getJSON("/api/assets");
    if (live.active) loadBuild();
  } catch (e) { live = null; }
  render();
}
$("#fold").onclick = () => { collapsed = !collapsed; api("/api/overlay", { method: "POST", body: JSON.stringify({ action: collapsed ? "collapse" : "expand" }) }); render(); };
$("#close").onclick = () => api("/api/overlay", { method: "POST", body: JSON.stringify({ action: "close" }) });
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
