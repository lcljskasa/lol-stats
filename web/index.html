<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LOL 战绩速览</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #1b1b20;
  --side: #121215;
  --top: #17171b;
  --card: #232329;
  --card-2: #2c2c33;
  --card-3: #34343c;
  --line: rgba(255, 255, 255, .06);
  --line-2: rgba(255, 255, 255, .11);
  --text: #ffffff;
  --text-2: #b8b8c6;
  --text-3: #7d7c8f;
  --gold: #8b6dff;          /* 主色：紫 */
  --gold-hi: #e6e0ff;
  --gold-lo: #4a3c9a;
  --accent: #7b5cff;
  --win: #5383e8;           /* OP.GG 胜利蓝 */
  --win-bg: #28344e;
  --loss: #e84057;          /* OP.GG 失败红 */
  --loss-bg: #59343b;
  --mid: #ffb900;
  --num: "Bahnschrift", "DIN Alternate", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body { font: 13px/1.45 "Microsoft YaHei UI", "Segoe UI", "PingFang SC", sans-serif; user-select: none; -webkit-font-smoothing: antialiased; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { display: block; }
.c-good { color: var(--win); } .c-bad { color: var(--loss); } .c-mid { color: var(--mid); } .c-dim { color: var(--text-3); } .c-gold { color: var(--gold); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .1); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }

/* ================= 外框：左侧导航 + 顶栏 ================= */
.app { height: 100vh; display: grid; grid-template-columns: 72px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.side { background: var(--side); display: flex; flex-direction: column; align-items: center; padding: 12px 0 10px; gap: 4px;
        border-right: 1px solid var(--line); z-index: 21; }
.logo { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, #8b6dff, #5b3fd9); display: grid; place-items: center;
        margin-bottom: 14px; box-shadow: 0 6px 18px rgba(123, 92, 255, .35); }
.logo::after { content: ""; width: 14px; height: 14px; border: 2.5px solid #fff; border-radius: 3px; transform: rotate(45deg); }
.nav { display: flex; flex-direction: column; gap: 4px; width: 100%; align-items: center; }
.navb { width: 56px; padding: 8px 0 6px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px;
        color: var(--text-3); font-size: 11px; transition: background .15s, color .15s; position: relative; }
.navb svg { width: 21px; height: 21px; }
.navb:hover { color: var(--text); background: rgba(255, 255, 255, .05); }
.navb.on { color: #fff; background: rgba(123, 92, 255, .18); }
.navb.on::before { content: ""; position: absolute; left: -8px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--accent); }
.side .grow { flex: 1; }
.sideb { width: 44px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--text-3); transition: background .15s, color .15s; }
.sideb svg { width: 19px; height: 19px; }
.sideb:hover { color: var(--text); background: rgba(255, 255, 255, .05); }
.sideb.on { color: #b9a8ff; }
.sideb.upd { color: #fff; background: #00a383; position: relative; }
.sideb.upd::after { content: "新"; position: absolute; top: -4px; right: -4px; font-size: 10px; background: #e84057; color: #fff;
                    border-radius: 999px; padding: 0 4px; line-height: 15px; }
.ver { font-size: 10px; color: var(--text-3); margin-top: 6px; font-family: var(--num); }
.col { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.titlebar { height: 50px; flex: none; display: flex; align-items: center; background: var(--top); border-bottom: 1px solid var(--line); position: relative; z-index: 20; }
.drag { align-self: stretch; display: flex; align-items: center; }
.ptitle { padding: 0 18px; font-size: 15px; font-weight: 700; gap: 10px; }
.ptitle small { font-size: 12px; font-weight: 400; color: var(--text-3); }
.status { gap: 8px; color: var(--text-3); font-size: 12px; padding: 0 14px; min-width: 0; }
.status b { color: var(--text-2); font-weight: 400; }
.led { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); flex: none; }
.led.ok { background: #00bba3; box-shadow: 0 0 8px #00bba3; }
.led.bad { background: var(--loss); box-shadow: 0 0 8px var(--loss); }
.status-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grow { flex: 1; }
.tools { display: flex; align-items: center; gap: 8px; padding-right: 8px; }
.seg { display: flex; padding: 3px; border-radius: 8px; background: var(--card); }
.seg button { padding: 4px 11px; border-radius: 6px; font-size: 12px; color: var(--text-3); transition: color .15s, background .15s; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button.on { color: #fff; background: var(--accent); }
.seg.count button { font-family: var(--num); min-width: 36px; }
.tbtn { height: 30px; padding: 0 12px; border-radius: 7px; display: inline-flex; align-items: center; gap: 6px;
        color: var(--text-2); font-size: 12px; transition: background .15s, color .15s, border-color .15s; white-space: nowrap; }
.tbtn:hover { background: rgba(255, 255, 255, .06); color: var(--text); }
.tbtn.on { color: #b9a8ff; }
.tbtn svg { width: 15px; height: 15px; }
.tbtn.primary { color: #fff; background: var(--accent); border: 0; }
.tbtn.primary:hover { background: #8d72ff; }
.tbtn:disabled { opacity: .4; cursor: default; }
.winctl { display: flex; align-self: stretch; }
.winctl button { width: 46px; display: grid; place-items: center; color: var(--text-2); transition: background .12s, color .12s; }
.winctl button:hover { background: rgba(255, 255, 255, .07); color: var(--text); }
.winctl button.close:hover { background: #c42b1c; color: #fff; }
.winctl svg { width: 10px; height: 10px; }

main { flex: 1; min-height: 0; padding: 14px; position: relative; }
main.scroll { overflow-y: auto; }
main::-webkit-scrollbar { width: 9px; }
main { height: calc(100vh - 52px); padding: 16px; position: relative; }
.panel { min-height: 0; display: flex; flex-direction: column; border-radius: 14px; background: var(--card); border: 1px solid var(--line); overflow: hidden; }
.panel-head { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); flex: none; }
.panel-head h2 { font-size: 14px; font-weight: 600; color: var(--gold-hi); }
.panel-head span { font-size: 12px; color: var(--text-3); }
.panel-body { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px; }
.list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.list > * { flex: none; }

/* ================= 玩家卡 ================= */
.team { height: 100%; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.card { position: relative; display: flex; flex-direction: column; min-height: 0; overflow: hidden; border-radius: 14px;
        background: var(--card); border: 1px solid var(--line); cursor: pointer; transition: border-color .2s, transform .2s, box-shadow .2s; }
.card:hover { border-color: var(--line-2); transform: translateY(-3px); box-shadow: 0 18px 40px rgba(0, 0, 0, .5); }
.card.sel { border-color: var(--gold-lo); box-shadow: 0 0 0 1px var(--gold-lo), 0 18px 40px rgba(0, 0, 0, .5); }
.card.me { border-color: rgba(200, 170, 110, .28); }
.card.enter { animation: rise .45s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.hero { position: relative; flex: 0 0 40%; min-height: 190px; overflow: hidden; background: #0a0d12; }
.hero .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 14%; transition: transform .6s ease; }
.card:hover .hero .art { transform: scale(1.045); }
.hero.ghost .art { filter: grayscale(.85) brightness(.55); }
.hero::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(7, 9, 13, .35) 0%, transparent 28%, transparent 45%, rgba(13, 17, 23, .85) 80%, var(--card) 100%); }
.hero-top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; z-index: 2; }
.pos { font-size: 11px; letter-spacing: .14em; color: var(--gold-hi); padding: 3px 9px; border-radius: 999px;
       background: rgba(7, 9, 13, .7); border: 1px solid rgba(139, 109, 255, .4); }
.me-flag { font-size: 11px; color: #1a1408; background: var(--gold); padding: 3px 9px; border-radius: 999px; font-weight: 600; }
.hero-bottom { position: absolute; left: 16px; right: 16px; bottom: 12px; z-index: 2; }
.pick-name { font-size: 12px; color: var(--gold); letter-spacing: .06em; margin-bottom: 2px; text-shadow: 0 1px 6px #000; }
.pick-name.none { color: var(--text-3); }
.pname { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.pname b { font-size: 19px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 10px #000; }
.pname span { font-size: 12px; color: var(--text-2); flex: none; }
.rank { display: flex; align-items: center; gap: 7px; margin-top: 6px; font-size: 12px; color: var(--text-2); }
.gem { width: 9px; height: 9px; transform: rotate(45deg); border-radius: 2px; flex: none; }
.rank .tier { font-weight: 600; }
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 6px 16px 14px; }
.headline { display: flex; align-items: flex-end; justify-content: space-between; }
.big { font-size: 40px; line-height: 1; font-weight: 600; letter-spacing: -.01em; }
.big small { font-size: 20px; font-weight: 500; margin-left: 1px; }
.cap { font-size: 11px; color: var(--text-3); margin-top: 5px; letter-spacing: .04em; }
.kda { text-align: right; }
.kda .v { font-size: 22px; line-height: 1; font-weight: 600; }
.kda .s { font-size: 12px; color: var(--text-2); margin-top: 5px; }
.wl { display: flex; height: 4px; border-radius: 4px; overflow: hidden; margin: 12px 0 5px; background: var(--line); }
.wl .w { background: var(--win); } .wl .l { background: var(--loss); opacity: .85; }
.wl-text { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); }
.form { margin-top: 14px; }
.form-bar { display: flex; gap: 3px; margin-top: 6px; }
.form-bar i { flex: 1; height: 16px; border-radius: 3px; background: var(--line); }
.form-bar i.w { background: linear-gradient(var(--win), #2f6fb8); }
.form-bar i.l { background: linear-gradient(var(--loss), #a8303c); opacity: .9; }
.label { font-size: 11px; color: var(--text-3); letter-spacing: .04em; display: flex; justify-content: space-between; }
.notes { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; min-height: 18px; font-size: 12px; color: var(--text-2); }
.note::before { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; margin-right: 6px; vertical-align: middle; background: var(--text-3); }
.note.good::before { background: var(--win); } .note.bad::before { background: var(--loss); } .note.gold::before { background: var(--gold); }
.note.good { color: #9cc9ff; } .note.bad { color: #ff9aa3; } .note.gold { color: var(--gold-hi); }
.mini { flex: 1; min-height: 0; overflow: hidden; margin-top: 12px; display: flex; flex-direction: column; flex-wrap: wrap;
        align-content: flex-start; column-gap: 40px; row-gap: 3px; }
.mini > * { width: 100%; }
.mr { flex: none; display: grid; grid-template-columns: 2px 22px 1fr auto; align-items: center; gap: 8px; height: 28px;
      padding-right: 8px; border-radius: 6px; background: rgba(255, 255, 255, .025); overflow: hidden; }
.mr .e { align-self: stretch; }
.mr.w .e { background: var(--win); } .mr.l .e { background: var(--loss); }
.mr img, .mr .ph { width: 22px; height: 22px; border-radius: 5px; object-fit: cover; background: var(--card-2); }
.mr .n { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
.mr .n em { font-style: normal; color: var(--text-3); font-size: 11px; margin-left: 4px; }
.mr .s { font-family: var(--num); font-size: 12px; }
.d { color: var(--loss); }
.pool { padding-top: 10px; margin-top: 10px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.pc { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; }
.pc img, .pc .ph { width: 30px; height: 30px; border-radius: 7px; object-fit: cover; background: var(--card-2); border: 1px solid var(--line); }
.pc-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-sub { font-size: 11px; color: var(--text-3); }
.pc-wr { font-size: 15px; font-weight: 600; text-align: right; }
.sk { background: linear-gradient(90deg, #10151c 0%, #19212b 50%, #10151c 100%); background-size: 200% 100%;
      animation: shimmer 1.3s linear infinite; border-radius: 6px; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ================= 对局行（OP.GG 风格） ================= */
.g { display: grid; grid-template-columns: 3px 44px 40px 1fr 110px 196px 54px; align-items: center; gap: 10px;
     padding: 7px 14px 7px 0; border-radius: 10px; overflow: hidden; cursor: pointer; transition: filter .15s; }
.g:hover { filter: brightness(1.18); }
.g .edge { align-self: stretch; margin: -7px 0; }
.g.w { background: linear-gradient(90deg, rgba(90, 169, 255, .10), rgba(90, 169, 255, .03) 60%); }
.g.l { background: linear-gradient(90deg, rgba(255, 93, 108, .10), rgba(255, 93, 108, .03) 60%); }
.g.w .edge { background: var(--win); } .g.l .edge { background: var(--loss); }
.ch { position: relative; width: 44px; height: 44px; }
.ch img, .ch .ph { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--card-2); }
.ch i { position: absolute; right: -3px; bottom: -3px; font: 600 10px var(--num); font-style: normal; background: #000; color: var(--text-2);
        border-radius: 5px; padding: 0 4px; border: 1px solid var(--line-2); }
.sp { display: grid; grid-template-columns: 19px 19px; gap: 2px; }
.sp img, .sp .ph { width: 19px; height: 19px; border-radius: 4px; background: var(--card-2); }
.g .t1 { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g .t2 { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g .res { font-size: 12px; font-weight: 600; margin-left: 6px; }
.g .k .t1 { font-family: var(--num); font-size: 15px; font-weight: 600; }
.items { display: flex; gap: 2px; }
.items img, .items .ph { width: 26px; height: 26px; border-radius: 5px; background: rgba(255, 255, 255, .04); }
.g .cs { text-align: right; }

/* ================= 抽屉 / 弹窗 ================= */
.scrim { position: absolute; inset: 0; background: rgba(10, 10, 14, .72); z-index: 30; }
.scrim.enter { animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(760px, 62%); z-index: 31; background: #0b0f14;
          border-left: 1px solid var(--line-2); display: flex; flex-direction: column; box-shadow: -30px 0 60px rgba(0, 0, 0, .5); }
.drawer.enter { animation: slide .28s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.banner { position: relative; height: 140px; flex: none; overflow: hidden; }
.banner img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11, 15, 20, .1), #0b0f14); }
.banner-text { position: absolute; left: 20px; bottom: 12px; right: 60px; z-index: 2; }
.banner-text b { font-size: 20px; color: #fff; font-weight: 600; text-shadow: 0 2px 10px #000; }
.banner-text div { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.x { position: absolute; top: 12px; right: 12px; z-index: 3; width: 32px; height: 32px; border-radius: 50%;
     display: grid; place-items: center; background: rgba(7, 9, 13, .6); color: var(--text-2); }
.x:hover { color: #fff; background: rgba(7, 9, 13, .85); }
.x svg { width: 12px; height: 12px; }
.modal { position: absolute; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(1080px, calc(100% - 40px));
         max-height: calc(100% - 30px); display: flex; flex-direction: column; background: #0b0f14; border: 1px solid var(--line-2);
         border-radius: 16px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); overflow: hidden; }
.modal.enter { animation: pop .22s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -48%) scale(.98); } }
.scrim.top { z-index: 40; position: fixed; }
#overlay .modal { position: fixed; top: calc(50% + 26px); max-height: calc(100vh - 90px); }
.mhead { display: flex; align-items: center; gap: 14px; padding: 16px 60px 16px 20px; border-bottom: 1px solid var(--line); position: relative; flex-wrap: wrap; }
.mhead h2 { font-size: 16px; }
.mhead span { color: var(--text-3); font-size: 12px; }
.mhead .x { top: 50%; transform: translateY(-50%); right: 14px; }
.mbody { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.mbody > * { flex: none; }
.tside { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.tside-h { display: flex; align-items: center; gap: 14px; padding: 9px 14px; font-size: 12px; color: var(--text-2); }
.tside-h b { font-size: 13px; }
.tside.w .tside-h { background: rgba(90, 169, 255, .08); } .tside.l .tside-h { background: rgba(255, 93, 108, .08); }
.tside.w .tside-h b { color: var(--win); } .tside.l .tside-h b { color: var(--loss); }
.prow, .hcols { display: grid; grid-template-columns: 40px 40px 26px minmax(110px, 1fr) 54px 100px 120px 50px 56px 40px 188px; align-items: center; gap: 10px; padding: 6px 14px; }
.prow { border-top: 1px solid var(--line); }
.hcols { font-size: 11px; color: var(--text-3); padding-top: 4px; padding-bottom: 4px; }
.prow.focus { background: rgba(200, 170, 110, .07); }
.prow .ch, .prow .ch img, .prow .ch .ph { width: 40px; height: 40px; }
.prow .who { min-width: 0; }
.prow .who b { display: block; font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .who span { font-size: 11px; color: var(--text-3); }
.keyst { display: grid; gap: 2px; justify-items: center; }
.keyst img, .keyst .ph { width: 26px; height: 26px; border-radius: 50%; background: #000; }
.keyst img + img { width: 16px; height: 16px; }
.score { text-align: center; }
.score b { font: 600 16px var(--num); }
.badge { display: inline-block; font: 700 10px var(--num); letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; margin-top: 2px; }
.badge.mvp { background: var(--gold); color: #1a1408; } .badge.ace { background: #8f6bd8; color: #fff; }
.bar2 { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 4px; }
.bar2 > div { height: 100%; background: linear-gradient(90deg, #d5504f, #ff8a65); }
.cell { font-size: 12px; text-align: right; }
.cell small { display: block; font-size: 11px; color: var(--text-3); }
.prow .items img, .prow .items .ph { width: 24px; height: 24px; }

/* ================= 我的页 ================= */
.me-grid { height: 100%; display: grid; grid-template-columns: 290px 1fr; gap: 14px; }
.me-grid .card { cursor: default; } .me-grid .card:hover { transform: none; box-shadow: none; }
.me-right { min-height: 0; display: grid; grid-template-rows: 200px 1fr; gap: 14px; }
.me-top { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 14px; min-height: 0; }
.me-bottom { display: grid; grid-template-columns: 1fr 1.6fr; gap: 14px; min-height: 0; }
.posbar { display: grid; grid-template-columns: 34px 1fr 80px; align-items: center; gap: 10px; font-size: 12px; margin-bottom: 9px; }
.posbar .track { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; }
.posbar .track div { height: 100%; background: linear-gradient(90deg, var(--gold-lo), var(--gold)); border-radius: 8px; }
.posbar .v { text-align: right; color: var(--text-2); }
.trend svg { width: 100%; height: 112px; display: block; }
.trend-legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); margin-top: 4px; }
.duo { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 5px 0; }
.duo img, .duo .ph { width: 30px; height: 30px; border-radius: 50%; background: var(--card-2); }
.duo b { font-weight: 500; font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.duo span { font-size: 11px; color: var(--text-3); }
table.t { width: 100%; border-collapse: collapse; font-size: 12px; }

/* ================= OP.GG 对局行 ================= */
.mg { display: grid; grid-template-columns: 6px 92px 1fr 220px; align-items: center; min-height: 96px; border-radius: 8px; overflow: hidden;

.mg-info { padding: 0 12px; font-size: 12px; color: var(--text-2); line-height: 1.5; }

.vcol { display: flex; flex-direction: column; gap: 2px; }
.vcol img, .vcol .ph { width: 22px; height: 22px; border-radius: 5px; background: rgba(0, 0, 0, .3); }
.vcol.round img, .vcol.round .ph { border-radius: 50%; background: #000; }
.mg-kda { padding: 0 10px; min-width: 104px; }
.mg-kda b { font: 700 15px var(--num); white-space: nowrap; }

.mg-kda small { display: block; font: 600 12px var(--num); color: var(--text-2); }
.mg-stat { padding-left: 10px; border-left: 1px solid rgba(255, 255, 255, .08); font-size: 11px; color: var(--text-2); line-height: 1.6; min-width: 112px; }

.mg-badge { display: inline-block; font: 700 10px var(--num); padding: 0 6px; border-radius: 999px; margin-left: 4px; }
.mg-badge.mvp { background: #ffb900; color: #1b1b20; } .mg-badge.ace { background: #8b6dff; color: #fff; }
.mg .items { gap: 3px; }
.mg .items img, .mg .items .ph { width: 24px; height: 24px; border-radius: 5px; background: rgba(0, 0, 0, .25); }
.mg-ps { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; padding: 8px 12px 8px 4px; font-size: 11px; color: var(--text-3); }
.mg-ps div { display: flex; align-items: center; gap: 4px; height: 18px; min-width: 0; }
.mg-ps img, .mg-ps .ph { width: 16px; height: 16px; border-radius: 4px; background: rgba(0, 0, 0, .3); flex: none; }

.drawer .mg-list { padding: 10px 12px 14px; overflow-y: auto; flex: 1; min-height: 0; }
.drawer { width: min(900px, 76%) !important; }
.badge.mvp { background: #ffb900 !important; color: #1b1b20 !important; }
.hint { font-size: 12px; color: var(--text-3); }
/* 更新窗口 */
.upd-modal { width: min(620px, calc(100% - 40px)); }
.upd-notes { overflow-y: auto; padding: 14px 22px; max-height: 50vh; font-size: 13px; line-height: 1.7; color: var(--text-2); }
.upd-notes h4 { font-size: 14px; color: #fff; margin: 10px 0 4px; }
.upd-notes h5 { font-size: 13px; color: var(--gold-hi); margin: 8px 0 2px; }
.upd-notes .li { padding-left: 14px; position: relative; }
.upd-notes .li::before { content: "•"; position: absolute; left: 2px; color: var(--accent); }
.upd-notes .li.sub { padding-left: 30px; } .upd-notes .li.sub::before { left: 18px; }
.upd-notes b { color: #fff; }
.upd-foot { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.upd-prog { flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text-2); }
/* 符文编辑 */
.rb { padding: 0; border-radius: 50%; display: block; }
.rb:hover img:not(.sel) { opacity: .7; filter: grayscale(.3); }
.spick { display: flex; gap: 4px; justify-content: center; }
.spick button { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; opacity: .35; transition: opacity .15s, background .15s; }
.spick button:hover { opacity: .8; }
.spick button.on { opacity: 1; background: rgba(139, 109, 255, .18); }

/* 游戏中 10 人：两排紧凑卡片 */
.team.ten { grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 10px; }

/* ================= 梯队页 ================= */

/* ================= 空状态 / 提示 ================= */
.empty { height: 100%; display: grid; place-items: center; text-align: center; position: relative; overflow: hidden; }
.empty::before { content: ""; position: absolute; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(200, 170, 110, .07), transparent 60%); }

.rings { width: 120px; height: 120px; margin: 0 auto 28px; position: relative; }
.rings i { position: absolute; inset: 0; border: 1px solid rgba(200, 170, 110, .45); transform: rotate(45deg); border-radius: 14px; animation: pulse 2.8s ease-out infinite; }
.rings i:nth-child(2) { animation-delay: .9s; } .rings i:nth-child(3) { animation-delay: 1.8s; }
.rings b { position: absolute; inset: 42px; transform: rotate(45deg); background: var(--gold); border-radius: 5px; box-shadow: 0 0 30px rgba(200, 170, 110, .6); }
@keyframes pulse { from { transform: rotate(45deg) scale(.35); opacity: 1; } to { transform: rotate(45deg) scale(1); opacity: 0; } }
.empty h2 { font-size: 22px; font-weight: 600; color: var(--gold-hi); letter-spacing: .08em; }

@keyframes rot { to { transform: rotate(360deg); } }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 60; padding: 10px 18px; border-radius: 10px;
         background: #1b2330; border: 1px solid var(--line-2); box-shadow: 0 10px 30px rgba(0, 0, 0, .5); font-size: 13px; animation: pop2 .2s both; }

</style>

<script>
const TOKEN = "__APP_TOKEN__";
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { "X-App-Token": TOKEN } });
async function getJSON(path) {
  const r = await api(path);
  const d = await r.json();
  if (!r.ok || (d && d.error)) throw new Error((d && d.error) || ("HTTP " + r.status));
  return d;
}

const QUEUES = { 420: "单双排", 440: "灵活排", 400: "匹配", 430: "匹配", 490: "快速匹配", 450: "大乱斗",
                 1700: "斗魂竞技场", 1900: "无限火力", 900: "无限乱斗", 830: "人机", 840: "人机", 850: "人机" };
const MODES = { all: null, rank: [420, 440], normal: [400, 430, 490], aram: [450] };
const MODE_NAMES = { all: "", rank: "排位", normal: "匹配", aram: "大乱斗" };
const POS = { top: "上单", jungle: "打野", middle: "中单", bottom: "ADC", utility: "辅助" };
const POS_ORDER = ["top", "jungle", "middle", "bottom", "utility"];
const OTIER_NAMES = { all: "全段位", platinum_plus: "铂金以上", emerald_plus: "翡翠以上", diamond_plus: "钻石以上", master_plus: "大师以上" };
const TIER_COLORS = { IRON: "#8a7d76", BRONZE: "#c08560", SILVER: "#aab7c2", GOLD: "#e6be5f", PLATINUM: "#4fc7b5",
  EMERALD: "#43c985", DIAMOND: "#86aeff", MASTER: "#c784ff", GRANDMASTER: "#ff6e6e", CHALLENGER: "#f6d683" };

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

let state = null, assets = { champions: {}, items: {}, perks: {}, styles: {}, spells: {} }, assetsFor = null;
let tab = ["team", "me", "build", "tier"].includes(location.hash.slice(1)) ? location.hash.slice(1) : store.get("tab", "team"), mode = store.get("mode", "all"), otier = store.get("otier", "emerald_plus");
let selected = null, lastKey = "", lastPhase = null;
const fresh = { drawer: false, modal: false };
const seen = new Set();
// 出装页状态
const B = { champ: store.get("bchamp", 145), pos: null, target: null, mode: "ranked", data: null, err: null, loading: false,
            mu: null, runeIdx: 0, search: "", auto: true, autoKey: null, reqId: 0 };
// 梯队页状态
const T = { pos: store.get("tpos", "bottom"), mode: "ranked", rows: null, key: null, err: null, loading: false };
let modal = null;   // 单局详情 { id, focus, data, err }
const duosCache = {};
const showMore = { me: 40, drawer: 40 };  // 对局列表先显示多少场

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const champName = id => assets.champions[id] || "";
const pct = x => Math.round(x * 100);
const pct1 = x => x == null ? "--" : (x * 100).toFixed(1) + "%";
const tone = (wr, n) => n < 5 ? "c-dim" : wr >= .55 ? "c-good" : wr < .45 ? "c-bad" : "c-mid";
const wrTone = wr => wr == null ? "" : wr >= .52 ? "c-good" : wr < .48 ? "c-bad" : "";
const art = (kind, id) => `/art/${kind}/${id}`;
function img(kind, id, cls = "", title = "") {
  if (!id) return `<div class="ph ${cls}"></div>`;
  return `<img class="${cls}" src="${art(kind, id)}" alt="" title="${esc(title)}" decoding="async" loading="lazy" onerror="this.style.visibility='hidden'">`;
}
const itemImg = id => img("item", id, "", assets.items[id]);
const perkImg = (id, cls = "") => img("perk", id, cls, assets.perks[id]);
const spellImg = id => img("spell", id, "", assets.spells[id]);
const styleImg = id => img("style", id, "", assets.styles[id]);

function ago(t) {
  const m = (Date.now() - t) / 60000;
  if (m < 60) return Math.max(1, Math.round(m)) + " 分钟前";
  if (m < 1440) return Math.round(m / 60) + " 小时前";
  if (m < 43200) return Math.round(m / 1440) + " 天前";
  return new Date(t).toLocaleDateString("zh-CN");
}
let toastTimer;
function toast(msg, bad = false) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2600);
}

/* ---------------- 战绩统计 ---------------- */
function stats(p) {
  const qs = MODES[mode];
  const gs = (p.games || []).filter(g => g.dur >= 300 && (!qs || qs.includes(g.q))).slice(0, state.settings.games);
  const n = gs.length;
  if (!n) return { n: 0, gs, champs: [] };
  const wins = gs.filter(g => g.win).length;
  const sum = k => gs.reduce((a, g) => a + (g[k] || 0), 0);
  const [k, d, a] = ["k", "d", "a"].map(sum);
  const by = {};
  for (const g of gs) {
    const c = by[g.c] ??= { id: g.c, n: 0, w: 0, k: 0, d: 0, a: 0, cs: 0, min: 0, dmg: 0 };
    c.n++; c.w += g.win; c.k += g.k; c.d += g.d; c.a += g.a; c.cs += g.cs; c.min += g.dur / 60; c.dmg += g.dmg || 0;
  }
  const champs = Object.values(by).sort((x, y) => y.n - x.n || y.w - x.w);
  let streak = 0;
  for (const g of gs) { if (g.win === gs[0].win) streak++; else break; }
  const all = (p.games || []).length;
  return { n, gs, wins, wr: wins / n, kda: (k + a) / Math.max(d, 1), avg: [k / n, d / n, a / n],
           champs, streak, streakWin: gs[0].win, aramShare: all ? p.games.filter(g => g.q === 450).length / all : 0 };
}
function notes(p, s) {
  const t = [];
  if (s.streak >= 3) t.push(s.streakWin ? ["good", `${s.streak} 连胜`] : ["bad", `${s.streak} 连败`]);
  const top = s.champs[0];
  if (top && s.n >= 10 && top.n / s.n >= .4) t.push(["gold", `绝活 ${champName(top.id)}`]);
  if (p.champ) {
    const c = s.champs.find(c => c.id === p.champ);
    if (!c && s.n >= 10) t.push(["bad", "本局英雄近期没玩过"]);
    else if (c && c.n >= 5) t.push([c.w / c.n >= .55 ? "good" : c.w / c.n < .45 ? "bad" : "", `本局英雄 ${c.w}胜${c.n - c.w}负`]);
  }
  if (s.n >= 10 && s.kda >= 4) t.push(["good", "数据亮眼"]);
  if (mode === "all" && s.aramShare > .5) t.push(["", "常玩大乱斗"]);
  return t.slice(0, 3);
}
function rankLine(r) {
  if (!r) return `<span class="c-dim">段位未知</span>`;
  if (!r.tier) return `<span class="gem" style="background:#3a3f47"></span><span class="c-dim">${esc(r.text)}</span>`;
  const games = r.wins + r.losses, color = TIER_COLORS[r.tier] || "var(--text)";
  return `<span class="gem" style="background:${color};box-shadow:0 0 8px ${color}"></span>`
    + `<span class="tier" style="color:${color}">${esc(r.text)}</span><span class="num">${r.lp} 点</span>`
    + (games ? `<span class="c-dim num">· 赛季 ${pct(r.wins / games)}%</span>` : "");
}

/* ---------------- 玩家卡 ---------------- */
function hero(p, s, solo = false) {
  const artId = p.champ || s?.champs?.[0]?.id;
  const ghost = !p.champ && !solo;
  const pick = p.champ ? `<div class="pick-name">${esc(champName(p.champ))}</div>`
             : solo && artId ? `<div class="pick-name">常用 · ${esc(champName(artId))}</div>`
             : `<div class="pick-name none">${p.loading ? "　" : "尚未选择英雄"}</div>`;
  return `<div class="hero${ghost ? " ghost" : ""}">
    ${artId ? `<img class="art" src="${art("load", artId)}" alt="" onerror="this.remove()">` : ""}
    <div class="hero-top"><span class="pos">${p.enemy ? "敌方 · " : ""}${esc(p.pos || (solo ? "我的战绩" : "玩家"))}</span>${p.me ? '<span class="me-flag">我</span>' : ""}</div>
    <div class="hero-bottom">${pick}
      <div class="pname"><b>${esc(p.name || (p.loading ? "查询中…" : ""))}</b>${p.tag ? `<span>#${esc(p.tag)}</span>` : ""}</div>
      <div class="rank">${p.loading ? '<span class="c-dim">正在读取段位…</span>' : rankLine(p.rank)}</div>
    </div></div>`;
}
function skeleton(p, solo) {
  return `${hero(p, null, solo)}<div class="body">
    <div class="headline"><div class="sk" style="width:90px;height:40px"></div><div class="sk" style="width:70px;height:30px"></div></div>
    <div class="sk" style="height:4px;margin:14px 0 18px"></div><div class="sk" style="height:16px"></div>
    <div class="mini">${'<div class="sk" style="height:28px;flex:none"></div>'.repeat(6)}</div>
    <div class="pool">${'<div class="sk" style="height:30px"></div>'.repeat(3)}</div></div>`;
}
function cardBody(p, s) {
  if (p.error) return `<div class="body"><p class="c-dim" style="margin-top:12px">${esc(p.error)}</p></div>`;
  if (!s.n) return `<div class="body"><p class="c-dim" style="margin-top:12px">最近没有${MODE_NAMES[mode]}对局</p></div>`;
  const form = Array.from({ length: 10 }, (_, j) => {
    const g = s.gs[j];
    return `<i class="${g ? (g.win ? "w" : "l") : ""}" title="${g ? esc(`${champName(g.c)} ${g.k}/${g.d}/${g.a}`) : ""}"></i>`;
  }).join("");
  const pool = s.champs.slice(0, 3).map(c => `<div class="pc">${img("square", c.id)}
      <div style="min-width:0"><div class="pc-name">${esc(champName(c.id))}</div><div class="pc-sub num">${c.n} 场 · ${c.w}胜</div></div>
      <div class="pc-wr num ${tone(c.w / c.n, c.n >= 3 ? 5 : 0)}">${pct(c.w / c.n)}%</div></div>`).join("");
  const ns = notes(p, s).map(([c, t]) => `<span class="note ${c}">${esc(t)}</span>`).join("");
  return `<div class="body">
    <div class="headline">
      <div><div class="big num ${tone(s.wr, s.n)}">${pct(s.wr)}<small>%</small></div><div class="cap">近 ${s.n} 场${MODE_NAMES[mode]}胜率</div></div>
      <div class="kda"><div class="v num ${s.kda >= 3.5 ? "c-good" : s.kda < 2 ? "c-bad" : ""}">${s.kda.toFixed(2)}</div>
        <div class="s num">${s.avg.map(x => x.toFixed(1)).join(" / ")}</div></div>
    </div>
    <div class="wl"><div class="w" style="width:${s.wr * 100}%"></div><div class="l" style="flex:1"></div></div>
    <div class="wl-text num"><span>${s.wins} 胜</span><span>${s.n - s.wins} 负</span></div>
    <div class="form"><div class="label"><span>最近 10 场</span><span>新 → 旧</span></div><div class="form-bar">${form}</div></div>
    <div class="notes">${ns}</div>
    <div class="mini">${s.gs.slice(0, 12).map(g => `<div class="mr ${g.win ? "w" : "l"}"><div class="e"></div>${img("square", g.c)}
      <div class="n">${esc(champName(g.c))}<em>${esc(QUEUES[g.q] || "其他")} · ${ago(g.t)}</em></div>
      <div class="s">${g.k}/<span class="d">${g.d}</span>/${g.a}</div></div>`).join("")}</div>
    <div class="pool">${pool}</div></div>`;
}
function card(p, { clickable = true, solo = false } = {}) {
  const enter = seen.has(p.key) ? "" : " enter";
  const cls = `card${p.me ? " me" : ""}${p.enemy ? " enemy" : ""}${selected === p.key ? " sel" : ""}${enter}`;
  const i = (state.players || []).indexOf(p);
  const attrs = `class="${cls}" style="animation-delay:${Math.max(0, i) * 60}ms"${clickable && !p.loading && !p.error ? ` data-key="${esc(p.key)}"` : ""}`;
  if (p.loading) return `<div ${attrs}>${skeleton(p, solo)}</div>`;
  const s = stats(p);
  return `<div ${attrs}>${hero(p, s, solo)}${cardBody(p, s)}</div>`;
}

/* ---------------- 对局行（OP.GG 风格） ---------------- */
// 每局的 10 人数据按需加载：同时最多 4 个请求，加载完稍等一下统一重画
const gameCache = {}, gamePending = new Set(), gameQueue = [];
let gameActive = 0, gameRenderTimer = null;
function needGame(id) {
  if (gameCache[id] || gamePending.has(id)) return;
  gamePending.add(id); gameQueue.push(id); pumpGames();
}
function pumpGames() {
  while (gameActive < 4 && gameQueue.length) {
    const id = gameQueue.shift();
    gameActive++;
    getJSON(`/api/game/${id}`).then(d => { gameCache[id] = d; }).catch(() => { gameCache[id] = { error: true }; })
      .finally(() => {
        gameActive--; gamePending.delete(id); pumpGames();
        clearTimeout(gameRenderTimer); gameRenderTimer = setTimeout(() => render(), 150);
      });
  }
}
function gameRow(g, puuid, i = 0) {
  const d = gameCache[g.id];
  if (!d && i < 30 && state?.connected) needGame(g.id);
  const ok = d && !d.error;
  const me = ok ? d.players.find(x => x.puuid === puuid) : null;
  const min = Math.max(g.dur / 60, 1);
  const items = (g.items || []).map(id => id ? itemImg(id) : '<div class="ph"></div>').join("");
  const teams = ok ? [100, 200].map(t => d.players.filter(x => x.team === t)) : null;
  const ps = teams ? Array.from({ length: 5 }, (_, k) => teams.map(team => {
      const x = team[k];
      return x ? `<div class="${x.puuid && x.puuid === puuid ? "me" : ""}">${img("square", x.c)}<span>${esc(x.name || champName(x.c))}</span></div>` : "<div></div>";
    }).join("")).join("")
    : `<div class="c-dim" style="grid-column:1/3">${d?.error ? "" : "读取中…"}</div>`;
  const badge = me?.badge ? `<span class="mg-badge ${me.badge.toLowerCase()}">${me.badge}</span>` : "";
  return `<div class="mg ${g.win ? "w" : "l"}" data-game="${g.id}" data-focus="${esc(puuid || "")}"><div class="bar"></div>
    <div class="mg-info"><div class="q">${esc(QUEUES[g.q] || "其他")}</div><div>${ago(g.t)}</div><hr>
      <div class="res">${g.win ? "胜利" : "失败"}</div><div class="num">${Math.floor(g.dur / 60)}分${String(g.dur % 60).padStart(2, "0")}秒</div></div>
    <div class="mg-main"><div class="mg-top">
        <div class="ch">${img("square", g.c, "", champName(g.c))}${g.lvl ? `<i>${g.lvl}</i>` : ""}</div>
        <div class="vcol">${(g.spells || []).map(spellImg).join("")}</div>
        <div class="vcol round">${perkImg(g.perk)}${styleImg(g.sub)}</div>
        <div class="mg-kda"><b>${g.k} / <span class="d">${g.d}</span> / ${g.a}</b><small>${((g.k + g.a) / Math.max(g.d, 1)).toFixed(2)}:1 KDA</small></div>
        <div class="mg-stat">${me ? `<div class="kp">参团 ${pct(me.kp)}%</div>` : ""}<div>补刀 ${g.cs} (${(g.cs / min).toFixed(1)})</div>
          ${me ? `<div>评分 <b class="num">${me.score.toFixed(1)}</b>${badge}</div>` : `<div>${g.pos ? POS[g.pos] : ""}</div>`}</div>
      </div><div class="items">${items}</div></div>
    <div class="mg-ps">${ps}</div></div>`;
}

function emptyView() {

  return `<div class="empty"><div class="empty-inner"><div class="rings"><i></i><i></i><i></i><b></b></div>

    ${c ? '<button class="tbtn primary" data-tab="me">看看我的战绩</button>' : '<button class="tbtn primary" data-tab="tier">看看版本梯队</button>'}</div></div>`;
}
function teamView() {
  const players = state.view === "team" ? state.players || [] : [];
  if (!players.length) return emptyView();
  if (!players.some(p => p.key === selected && !p.loading)) selected = null;
  const sel = players.find(p => p.key === selected);
  if (players.some(p => p.enemy)) {
    // 游戏中：上排我方、下排敌方，按位置排好，上下对齐就是每条线的对位
    const order = p => (POS_ORDER.indexOf(Object.keys(POS).find(k => POS[k] === p.pos)) + 1) || 9;
    const mine = players.filter(p => !p.enemy).sort((a, b) => order(a) - order(b));
    const theirs = players.filter(p => p.enemy).sort((a, b) => order(a) - order(b));
    return `<div class="team ten">${mine.map(p => card(p)).join("")}${theirs.map(p => card(p)).join("")}</div>${sel ? drawer(sel) : ""}`;
  }
  return `<div class="team">${players.map(p => card(p)).join("")}</div>${sel ? drawer(sel) : ""}`;
}

function rankCard(r, title) {
  const color = TIER_COLORS[r?.tier] || "#6f6f80";
  const games = (r?.wins || 0) + (r?.losses || 0);
  return `<section class="cardx rk-card"><div class="cardx-h"><h2>${title}</h2></div><div class="rk-body">
    <div class="emb" style="color:${color}"><i></i></div>
    <div><div class="t" style="color:${r?.tier ? color : "var(--text-3)"}">${esc(r?.tier ? r.text : "未定级")}</div>
      <div class="lp num">${r?.tier ? r.lp + " LP" : ""}</div></div>
    <div class="wr">${games ? `<b>${r.wins}胜 ${r.losses}负</b>胜率 ${pct(r.wins / games)}%` : "本赛季暂无对局"}</div></div></section>`;
}
function donut(wr) {
  const C = 2 * Math.PI * 34, win = C * wr;
  return `<svg viewBox="0 0 86 86"><circle cx="43" cy="43" r="34" fill="none" stroke="var(--loss)" stroke-width="9"/>
    <circle cx="43" cy="43" r="34" fill="none" stroke="var(--win)" stroke-width="9" stroke-dasharray="${win} ${C}" transform="rotate(-90 43 43)"/>
    <text x="43" y="48" text-anchor="middle" fill="#fff" font-size="15" font-weight="700" font-family="Bahnschrift">${pct(wr)}%</text></svg>`;
}

            <span class="${s.kda >= 3.5 ? "c-good" : s.kda < 2 ? "c-bad" : ""} num" style="font-weight:700">${s.kda.toFixed(2)}:1</span> KDA</div></div>

        <div class="mg-list">${s.gs.slice(0, showMore.me).map((g, i) => gameRow(g, p.puuid, i)).join("") || '<p class="hint">没有对局</p>'}

async function loadDuos(puuid) {
  duosCache[puuid] = undefined;
  try { duosCache[puuid] = await getJSON(`/api/duos?puuid=${encodeURIComponent(puuid)}`); }
  catch (e) { duosCache[puuid] = { error: "读取失败：" + e.message }; }
  if (tab === "me") render();
}

/* ---------------- 出装 · 对位页 ---------------- */
async function loadBuild() {
  const id = ++B.reqId;
  B.loading = true; B.err = null; B.runeIdx = 0; B.edit = null;
  if (tab === "build") render();
  try {
    const q = new URLSearchParams({ champ: B.champ, mode: B.mode, tier: otier });
    if (B.pos) q.set("pos", B.pos);
    if (B.target && B.mode === "ranked") q.set("target", B.target);
    const d = await getJSON("/api/opgg/build?" + q);
    if (id !== B.reqId) return;
    B.data = d; B.pos = d.pos;
    B.mu = null;
    if (B.target && B.pos && B.mode === "ranked") {
      const m = new URLSearchParams({ champ: B.champ, pos: B.pos, enemy: B.target, tier: otier });
      B.mu = await getJSON("/api/opgg/matchup?" + m).catch(e => ({ error: e.message }));
    }
  } catch (e) { if (id === B.reqId) B.err = e.message; }
  if (id !== B.reqId) return;
  B.loading = false;
  if (tab === "build") render();
}
/* 进入选英雄时：用我的英雄和位置，并推断对位的敌人 */
async function autoBuild() {
  const pk = state.pick || {};
  B.champ = pk.champ || B.champ; B.pos = pk.pos || null; B.target = null; B.mode = pk.aram ? "aram" : "ranked";
  if (!pk.aram && pk.pos && pk.enemies?.length) {
    try {
      const q = new URLSearchParams({ pos: pk.pos, enemies: pk.enemies.join(","), tier: otier });
      if (pk.champ) q.set("champ", pk.champ);
      const mu = await getJSON("/api/opgg/matchup?" + q);
      if (mu.enemy) B.target = mu.enemy;
    } catch (e) {}
  }
  loadBuild();
}
function itemIcons(ids, arrows = true) {

}
function itemTable(title, rows, arrows = true) {
  if (!rows?.length) return "";
  return `<div><h4>${title}</h4><table class="ot"><thead><tr><th></th><th>选取率</th><th>胜率</th></tr></thead><tbody>
    ${rows.map(x => `<tr><td>${itemIcons(x.ids, arrows)}</td><td>${pct1(x.pick)}<small>${(x.play || 0).toLocaleString()} 场</small></td>
      <td class="${wrTone(x.win)}">${pct1(x.win)}</td></tr>`).join("")}</tbody></table></div>`;
}
/* 符文编辑：在推荐方案的基础上点选修改，改完自动同步到客户端 */
let syncEdit = store.get("syncEdit", true), syncTimer = null;
function curRune(d) {
  return B.edit || d.runes[B.runeIdx] || d.runes[0];
}
function startEdit(d) {
  if (!B.edit) {
    const r = d.runes[B.runeIdx] || d.runes[0];
    B.edit = { primary: r.primary, secondary: r.secondary, primaryRunes: [...r.primaryRunes],
               secondaryRunes: [...r.secondaryRunes], shards: [...(r.shards || [])] };
  }
  return B.edit;
}
function firstOf(style, rows) {
  return (assets.slots?.[style] || []).slice(rows[0], rows[1]).map(r => r[0]);
}
function editRune(kind, a, b) {
  const d = B.data, e = startEdit(d);
  const rowOfSecondary = id => (assets.slots?.[e.secondary] || []).findIndex(r => r.includes(id));
  if (kind === "p") e.primaryRunes[a] = b;                                // 主系第 a 行选 b
  else if (kind === "sh") e.shards[a] = b;                                // 属性碎片第 a 行选 b
  else if (kind === "s") {                                                // 副系：两个符文必须在不同行
    const row = rowOfSecondary(b);
    const same = e.secondaryRunes.findIndex(x => rowOfSecondary(x) === row);
    if (same >= 0) e.secondaryRunes[same] = b;
    else { e.secondaryRunes.shift(); e.secondaryRunes.push(b); }
  } else if (kind === "ps") {                                             // 换主系
    if (a === e.primary) return;
    e.primary = a; e.primaryRunes = firstOf(a, [0, 4]);
    if (e.secondary === a) { e.secondary = Object.keys(assets.slots).map(Number).find(x => x !== a); e.secondaryRunes = firstOf(e.secondary, [1, 3]); }

    if (a === e.secondary || a === e.primary) return;
    e.secondary = a; e.secondaryRunes = firstOf(a, [1, 3]);
  }
  render();
  if (syncEdit && state.connected) { clearTimeout(syncTimer); syncTimer = setTimeout(() => importRunes(true), 500); }
}
function runeBox(d) {

function counterList(list, good) {

function trendBox(d) {
  const t = d.trend || [];
  if (t.length < 2) return "";
  const W = 300, H = 110, vals = t.map(x => x.win), lo = Math.min(...vals) - .005, hi = Math.max(...vals) + .005;
  const x = i => 16 + i / (t.length - 1) * (W - 32), y = v => H - 24 - (v - lo) / (hi - lo) * (H - 40);
  const path = vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const dots = vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#c8aa6e"/><text x="${x(i)}" y="${H - 6}" fill="#6c6f75" font-size="10" text-anchor="middle">${t[i].v}</text>`).join("");
  return `<div class="box third"><h3>版本胜率走势</h3><div class="trendline"><svg viewBox="0 0 ${W} ${H}">
    <path d="${path}" fill="none" stroke="#c8aa6e" stroke-width="2"/>${dots}</svg></div>
    <p class="hint num">${t.slice(-3).map(x => pct1(x.win)).join(" → ")}</p></div>`;
}

      <div><div class="hint" style="margin-bottom:8px">打 ${esc(champName(B.target))} 胜率最高的${POS[B.pos] || "英雄"}</div><div class="mu-picks">${picks || '<p class="hint">暂无数据</p>'}</div></div>

/* ---------------- 梯队页（OP.GG 风格） ---------------- */
T.view = store.get("tview", "lanes");
async function loadTiers() {
  const key = T.mode + otier;
  T.loading = true; T.err = null;
  try { T.data = await getJSON(`/api/opgg/tiers?mode=${T.mode}&tier=${otier}`); T.key = key; }
  catch (e) { T.err = e.message; }
  T.loading = false;
  if (tab === "tier") render();
}
const tb = (t, sm = "") => `<span class="tierb ${sm} tb${t ?? 5}">${t ? "T" + t : "-"}</span>`;
function tierTable(rows) {
  return `<table class="t"><thead><tr><th>英雄</th><th>梯队</th><th>胜率</th><th>选取率</th><th>禁用率</th><th>KDA</th><th>克制它的英雄</th><th>较上版本</th></tr></thead><tbody>
    ${rows.map(r => {
      const ch = r.prevPatch && r.rank ? r.prevPatch - r.rank : 0;
      return `<tr class="click" data-build="${r.id}" data-pos="${r.pos}"><td><div class="cn"><span class="rk">${r.rank || "-"}</span>${img("square", r.id)}${esc(champName(r.id) || "#" + r.id)}</div></td>
        <td>${tb(r.tier)}</td><td class="${wrTone(r.win)}">${pct1(r.win)}</td><td>${pct1(r.pick)}</td><td>${pct1(r.ban)}</td>
        <td>${r.kda ? r.kda.toFixed(2) : "--"}</td><td><div class="cnt" style="justify-content:flex-end">${(r.counters || []).map(c => img("square", c, "", champName(c))).join("")}</div></td>
        <td class="chg ${ch > 0 ? "c-good" : ch < 0 ? "c-bad" : "c-dim"}">${ch > 0 ? "▲ " + ch : ch < 0 ? "▼ " + -ch : "—"}</td></tr>`;
    }).join("")}</tbody></table>`;
}
function tierView() {
  if ((!T.data || T.key !== T.mode + otier) && !T.loading && !T.err) loadTiers();
  if (T.err) return `<div class="loading" style="height:80vh"><div>读取失败：${esc(T.err)}<br><br><button class="tbtn primary" data-tretry>重试</button></div></div>`;
  if (!T.data || T.key !== T.mode + otier) return `<div class="loading" style="height:80vh"><div><div class="spin"></div>正在读取 OP.GG 梯队…</div></div>`;
  const rows = T.data.rows || [];
  const head = `v${esc(T.data.version || "")} ${T.mode === "aram" ? "大乱斗" : "英雄"}梯队`;
  const sub = `${OTIER_NAMES[otier]} · 分析了 ${((T.data.matches || 0) / 10000).toFixed(0)} 万场 · 数据来自 OP.GG`;
  const modeSeg = `<div class="seg"><button class="${T.mode === "ranked" ? "on" : ""}" data-tmode="ranked">排位</button><button class="${T.mode === "aram" ? "on" : ""}" data-tmode="aram">大乱斗</button></div>`;
  if (T.mode === "aram") {
    const list = rows.slice().sort((a, b) => (a.rank || 999) - (b.rank || 999));
    return `<div class="tierwrap"><section class="cardx"><div class="cardx-h"><h2>${head}</h2><span>${sub}</span>${modeSeg}</div>${tierTable(list)}</section></div>`;
  }
  // 版本变化：和上个版本比，同位置排名上升 / 下滑最多（只看选取率 ≥ 0.5% 的）
  const moved = rows.filter(r => r.prevPatch && r.rank && r.pick >= .005).map(r => ({ ...r, delta: r.prevPatch - r.rank }));
  const ups = moved.filter(r => r.delta > 0).sort((a, b) => b.delta - a.delta).slice(0, 12);
  const downs = moved.filter(r => r.delta < 0).sort((a, b) => a.delta - b.delta).slice(0, 12);
  const chg = list => list.map(r => `<div class="chg-c" data-build="${r.id}" data-pos="${r.pos}" title="${esc(champName(r.id))} ${POS[r.pos]}：第 ${r.prevPatch} → ${r.rank} 名">
      ${img("square", r.id)}<span>${esc(champName(r.id))}</span><b class="${r.delta > 0 ? "c-good" : "c-bad"}">${r.delta > 0 ? "▲" : "▼"}${Math.abs(r.delta)} ${POS[r.pos]}</b></div>`).join("") || '<span class="hint">暂无</span>';
  const changes = `<section class="cardx"><div class="cardx-h"><h2>版本变化</h2><span>与上个版本相比，同位置排名变化最大的英雄（按数据统计，不是官方的加强 / 削弱公告）</span></div>
    <div class="cardx-b"><div class="chg-row"><span class="chg-lab up">上升</span><div class="chg-list">${chg(ups)}</div></div>
      <div class="chg-row"><span class="chg-lab down">下滑</span><div class="chg-list">${chg(downs)}</div></div></div></section>`;
  const viewSeg = `<div class="seg"><button class="${T.view === "lanes" ? "on" : ""}" data-tview="lanes">五路概览</button><button class="${T.view === "table" ? "on" : ""}" data-tview="table">详细数据</button></div>`;
  let body;
  if (T.view === "lanes") {
    body = `<div class="lanes">${POS_ORDER.map(pos => {
      const list = rows.filter(r => r.pos === pos).sort((a, b) => (a.rank || 999) - (b.rank || 999)).slice(0, 12);
      return `<div class="lane"><div class="lane-h">${POS[pos]}</div><table><thead><tr><th>#</th><th>英雄</th><th style="text-align:right">梯队</th></tr></thead><tbody>
        ${list.map(r => `<tr class="click" data-build="${r.id}" data-pos="${pos}"><td class="rk num">${r.rank}</td>
          <td><div class="cn">${img("square", r.id)}<span>${esc(champName(r.id))}</span></div></td><td style="text-align:right">${tb(r.tier, "sm")}</td></tr>`).join("")}</tbody></table></div>`;
    }).join("")}</div>`;
  } else {
    const tabs = `<div class="tabsx">${POS_ORDER.map(k => `<button class="${T.pos === k ? "on" : ""}" data-tpos="${k}">${POS[k]}</button>`).join("")}</div>`;
    body = tabs + tierTable(rows.filter(r => r.pos === T.pos).sort((a, b) => (a.rank || 999) - (b.rank || 999)));
  }
  return `<div class="tierwrap">${changes}<section class="cardx"><div class="cardx-h"><h2>${head}</h2><span>${sub}</span>
    <div style="margin-left:auto;display:flex;gap:8px">${viewSeg}${modeSeg}</div></div>${body}</section></div>`;
}

/* ---------------- 更新窗口 ---------------- */
let updOpen = false;
function miniMd(md) {
  // 只处理发布说明里用到的几种写法：标题、列表、粗体、链接
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(https?:\/\/[^\s<]+)/g, '<span class="c-gold">$1</span>');
  return (md || "").replace(/\r/g, "").split("\n").map(line => {
    if (/^##\s/.test(line)) return `<h4>${inline(line.replace(/^#+\s*/, ""))}</h4>`;
    if (/^###\s/.test(line)) return `<h5>${inline(line.replace(/^#+\s*/, ""))}</h5>`;
    if (/^\s{2,}-\s/.test(line)) return `<div class="li sub">${inline(line.replace(/^\s*-\s*/, ""))}</div>`;
    if (/^-\s/.test(line)) return `<div class="li">${inline(line.slice(2))}</div>`;
    return line.trim() ? `<p>${inline(line)}</p>` : "";
  }).join("");
}
function updModal() {
  const up = state?.update;
  if (!updOpen || !up) return "";
  const pr = state.updateProgress;
  let foot;
  if (pr?.stage === "downloading") {
    foot = `<div class="upd-prog"><div class="bar2" style="height:8px"><div style="width:${pr.pct}%;background:var(--accent)"></div></div>
      <span class="num">正在下载新版本… ${pr.pct}%（${pr.mb} MB）</span></div>`;
  } else if (pr?.stage === "restarting") {
    foot = `<div class="upd-prog"><span>下载完成，正在替换并重启程序…</span></div>`;
  } else {
    foot = `${pr?.stage === "error" ? `<div class="warn" style="margin-right:auto">${esc(pr.msg)}，可以去下载页面手动更新</div>` : ""}
      <button class="tbtn" data-upd="later">以后再说</button>
      <button class="tbtn" data-upd="page">去下载页面</button>
      <button class="tbtn primary" data-upd="now">立即更新</button>`;
  }
  return `<div class="scrim top" data-upd="later"></div><div class="modal upd-modal">
    <div class="mhead"><h2>发现新版本 v${esc(up.version)}</h2><span>当前 v${esc(state.appVersion)}</span>
      <button class="x" data-upd="later"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.5"/></svg></button></div>
    <div class="upd-notes">${miniMd(up.notes) || '<p class="hint">这个版本没有填写更新说明</p>'}</div>
    <div class="upd-foot">${foot}</div></div>`;
}

/* ---------------- 单局详情弹窗 ---------------- */
async function openGame(id, focus) {
  modal = { id, focus, data: null, err: null };
  fresh.modal = true;
  render();
  try { const d = await getJSON(`/api/game/${id}`); if (modal?.id === id) modal.data = d; }
  catch (e) { if (modal?.id === id) modal.err = e.message; }
  if (modal?.id === id) render();
}
function gameModal() {
  if (!modal) return "";
  const enter = fresh.modal ? " enter" : "";
  fresh.modal = false;
  const close = `<button class="x" data-close="modal"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.5"/></svg></button>`;
  const d = modal.data;
  let inner;
  if (modal.err) inner = `<div class="mhead"><h2>读取失败</h2><span>${esc(modal.err)}</span>${close}</div>`;
  else if (!d) inner = `<div class="mhead"><h2>对局详情</h2><span>读取中…</span>${close}</div><div class="loading" style="height:200px"><div class="spin"></div></div>`;
  else {
    const me = d.players.find(p => p.puuid === modal.focus);
    const maxDmg = Math.max(...d.players.map(p => p.dmg), 1);
    const min = Math.max(d.dur / 60, 1);
    const side = t => {
      const ps = d.players.filter(p => p.team === t.id);
      return `<div class="tside ${t.win ? "w" : "l"}"><div class="tside-h"><b>${t.win ? "胜利" : "失败"}</b><span>${t.id === 100 ? "蓝色方" : "红色方"}</span>
        <span class="num">击杀 ${t.kills}</span><span class="num">经济 ${(t.gold / 1000).toFixed(1)}k</span>
        <span class="num">推塔 ${t.towers}</span><span class="num">小龙 ${t.dragons}</span><span class="num">大龙 ${t.barons}</span></div>
        <div class="hcols"><span></span><span></span><span></span><span>玩家</span><span style="text-align:center">评分</span><span style="text-align:right">KDA</span>
          <span>伤害</span><span style="text-align:right">经济</span><span style="text-align:right">补刀</span><span style="text-align:right">视野</span><span>装备</span></div>
        ${ps.map(p => `<div class="prow${p.puuid && p.puuid === modal.focus ? " focus" : ""}">
          <div class="ch">${img("square", p.c)}<i>${p.lvl}</i></div>
          <div class="sp">${(p.spells || []).map(spellImg).join("")}</div>
          <div class="keyst">${perkImg(p.perk)}${styleImg(p.sub)}</div>
          <div class="who"><b>${esc(p.name || champName(p.c))}</b><span>${esc(champName(p.c))}${p.tag ? " #" + esc(p.tag) : ""}</span></div>
          <div class="score"><b class="${p.score >= 7 ? "c-gold" : ""}">${p.score.toFixed(1)}</b>${p.badge ? `<div><span class="badge ${p.badge.toLowerCase()}">${p.badge}</span></div>` : ""}</div>
          <div class="cell num">${p.k} / <span class="d">${p.d}</span> / ${p.a}<small>${((p.k + p.a) / Math.max(p.d, 1)).toFixed(2)} · 参团 ${pct(p.kp)}%</small></div>
          <div class="cell num" style="text-align:left">${p.dmg.toLocaleString()}<div class="bar2"><div style="width:${p.dmg / maxDmg * 100}%"></div></div></div>
          <div class="cell num">${(p.gold / 1000).toFixed(1)}k</div>
          <div class="cell num">${p.cs}<small>${(p.cs / min).toFixed(1)}/分</small></div>
          <div class="cell num">${p.vis}</div>
          <div class="items">${(p.items || []).map(id => id ? itemImg(id) : '<div class="ph"></div>').join("")}</div></div>`).join("")}</div>`;
    };
    inner = `<div class="mhead"><h2 class="${me ? (me.win ? "c-good" : "c-bad") : ""}">${me ? (me.win ? "胜利" : "失败") : "对局详情"}</h2>
        <span>${esc(QUEUES[d.q] || "其他")} · ${Math.round(d.dur / 60)} 分钟 · ${new Date(d.t).toLocaleString("zh-CN")}</span>
        <span>评分综合 KDA、参团、伤害、经济、视野、补刀（参考 OP Score 思路，本程序自行计算）</span>${close}</div>
      <div class="mbody">${d.teams.map(side).join("")}</div>`;
  }
  return `<div class="scrim top${enter}" data-close="modal"></div><div class="modal${enter}">${inner}</div>`;
}

/* ---------------- 渲染 ---------------- */
function render() {
  if (!state) return;
  $("#led").className = "led " + (state.connected ? "ok" : "bad");
  $("#status").innerHTML = [state.phase && `<b>${esc(state.phase)}</b>`, esc(state.status)].filter(Boolean).join(" · ");
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  document.querySelectorAll(".tools .seg").forEach(s => s.style.display = s.dataset.for.split(" ").includes(tab) ? "" : "none");
  document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b.dataset.v === mode));
  document.querySelectorAll("#otier button").forEach(b => b.classList.toggle("on", b.dataset.v === otier));
  $("#pin").classList.toggle("on", !!state.settings.topmost);
  $("#ovl").classList.toggle("on", state.settings.overlay !== false);
  const up = state.update;
  $("#upd").style.display = up ? "" : "none";
  if (up) $("#upd").title = `发现新版本 v${up.version}（当前 v${state.appVersion}），点击查看并更新`;
  $("#ver").textContent = "v" + (state.appVersion || "");
  $("#ovl").style.display = state.native ? "" : "none";
  $("#winctl").style.display = state.native ? "" : "none";

  // 记住滚动位置和搜索框光标，重画后恢复
  const scrolls = {};
  document.querySelectorAll("[data-scroll]").forEach(el => scrolls[el.dataset.scroll] = el.scrollTop);
  const typing = document.activeElement?.id === "csearch";
  const caret = typing ? document.activeElement.selectionStart : 0;

  $("#ptitle").innerHTML = { team: "队伍", me: "我的战绩", build: "出装 · 对位", tier: "英雄梯队" }[tab];
  $("#main").className = tab === "me" || tab === "tier" ? "scroll" : "";
  $("#main").innerHTML = tab === "team" ? teamView() : tab === "me" ? meView() : tab === "build" ? buildView() : tierView();
  $("#overlay").innerHTML = gameModal() + updModal();
  document.querySelectorAll("[data-scroll]").forEach(el => { if (scrolls[el.dataset.scroll]) el.scrollTop = scrolls[el.dataset.scroll]; });
  if (typing) { const s = $("#csearch"); s.focus(); s.setSelectionRange(caret, caret); }
  (state.players || []).forEach(p => { if (!p.loading) seen.add(p.key); });
}

async function post(path, body = {}) {
  try { await api(path, { method: "POST", body: JSON.stringify(body) }); } catch (e) {}
  poll();
}
async function loadAssets() {
  try { assets = await getJSON("/api/assets"); render(); } catch (e) { assetsFor = null; }
}
async function poll() {
  if (document.hidden) return;  // 窗口最小化 / 在托盘里时不刷新
  try {
    const next = await (await api("/api/state" + (state ? "?v=" + state.version : ""))).json();
    if (!("players" in next)) next.players = state?.players || [];
    state = next;
  } catch (e) {
    $("#status").textContent = "后台程序已退出";
    $("#led").className = "led bad";
    return;
  }
  if (assetsFor !== state.connected) { assetsFor = state.connected; loadAssets(); }
  if (tab === "build" && !B.data && !B.loading && !B.err) loadBuild();  // 上次停在出装页：打开时自动加载
  const inGame = ph => ph === "游戏中" || ph === "游戏加载中";
  if (inGame(state.phase) && lastPhase !== null && !inGame(lastPhase) && tab !== "team") setTab("team");
  if (state.phase === "选英雄中" && lastPhase !== null && lastPhase !== "选英雄中") {
    B.auto = true; B.autoKey = null; B.lastPick = null;  // 每局重新开启自动推荐（上一局手动换过英雄也一样）
    if (tab === "me") setTab("team");
  }
  lastPhase = state.phase;
  // 选英雄时，我的英雄、位置或对面阵容变了：自动刷新出装和对位
  const pk = JSON.stringify(state.pick || {});
  // 你在客户端里换了英雄：出装页跟着你的新英雄走（即使之前手动看过别的英雄）
  if (state.pick?.champ && state.pick.champ !== B.lastPick) { B.lastPick = state.pick.champ; B.auto = true; B.autoKey = null; }
  if (state.pick?.champ && pk !== B.autoKey) { B.autoKey = pk; if (B.auto) autoBuild(); }
  const key = [state.version, mode, selected, tab].join("|");
  if (key !== lastKey) { lastKey = key; render(); }
}
function setTab(t) {
  if (t !== tab) $("#main").scrollTop = 0;
  tab = t; store.set("tab", t);
  if (t === "me" && state && state.view !== "self") post("/api/self");
  if (t === "team" && state?.view === "self" && state.phase === "选英雄中") post("/api/team");
  if (t === "build" && !B.data && !B.loading) loadBuild();
  lastKey = ""; render();
}
function pickChamp(id, { pos = null, keepTarget = false } = {}) {
  B.champ = +id; store.set("bchamp", B.champ); B.pos = pos; B.auto = false;
  if (!keepTarget || B.target === B.champ) B.target = keepTarget ? B.target : null;
  if (B.target === B.champ) B.target = null;
  if (tab !== "build") { tab = "build"; store.set("tab", "build"); }
  loadBuild();
}

document.addEventListener("click", e => {
  const t = e.target;
  const nav = t.closest("[data-tab]");
  if (nav) { setTab(nav.dataset.tab); return; }
  const seg = t.closest(".seg button");
  if (seg?.parentElement.id === "mode") { mode = seg.dataset.v; store.set("mode", mode); lastKey = ""; render(); return; }
  if (seg?.parentElement.id === "otier") {
    otier = seg.dataset.v; store.set("otier", otier);
    if (tab === "build") loadBuild(); else render();
    return;
  }
  const win = t.closest("#winctl button");
  if (win) { post("/api/window", { action: win.dataset.a }); return; }
  const close = t.closest("[data-close]");
  if (close) { if (close.dataset.close === "modal") modal = null; else selected = null; render(); return; }
  const g = t.closest("[data-game]");
  if (g) { openGame(+g.dataset.game, g.dataset.focus); return; }
  const tgt = t.closest("[data-target]");
  if (tgt) { B.target = +tgt.dataset.target; B.auto = false; if (B.target === B.champ) B.target = null; loadBuild(); return; }
  const pick = t.closest("[data-pick]");
  if (pick) { pickChamp(pick.dataset.pick, { keepTarget: pick.hasAttribute("data-keep"), pos: pick.hasAttribute("data-keep") ? B.pos : null }); return; }
  const bld = t.closest("[data-build]");
  if (bld) { pickChamp(bld.dataset.build, { pos: bld.dataset.pos || null }); return; }
  const bpos = t.closest("[data-bpos]");
  if (bpos) { B.pos = bpos.dataset.bpos; B.target = null; loadBuild(); return; }
  const bmode = t.closest("[data-bmode]");
  if (bmode) { B.mode = bmode.dataset.bmode; loadBuild(); return; }
  if (t.closest("[data-retry]")) { loadBuild(); return; }
  if (t.closest("[data-tretry]")) { T.err = null; loadTiers(); return; }
  const ub = t.closest("[data-upd]");
  if (ub) {
    const a = ub.dataset.upd;
    if (a === "later" && !["downloading", "restarting"].includes(state.updateProgress?.stage)) { updOpen = false; render(); }
    if (a === "page") post("/api/open-update");
    if (a === "now") post("/api/do-update");
    return;
  }
  const ed = t.closest("[data-edit]");
  if (ed) { editRune(ed.dataset.edit, +ed.dataset.a, +ed.dataset.b); return; }
  if (t.closest("[data-rune-reset]")) { B.edit = null; render(); if (syncEdit && state.connected) importRunes(true); return; }
  if (t.closest("[data-toggle-sync]")) { syncEdit = !syncEdit; store.set("syncEdit", syncEdit); render(); return; }
  const sp = t.closest("[data-spells]");
  if (sp) { setSpells(sp.dataset.spells.split(",").map(Number)); return; }
  if (t.closest("[data-toggle-auto]")) {
    const on = state.settings.autoRunes === false;
    post("/api/settings", { autoRunes: on });
    toast(on ? "已开启：选定英雄后自动导入符文和召唤师技能" : "已关闭自动导入");
    return;
  }
  const rune = t.closest("[data-rune]");
  if (rune) { B.runeIdx = +rune.dataset.rune; B.edit = null; render(); if (syncEdit && state.connected && B.data) importRunes(true); return; }
  if (t.closest("[data-import]")) { importRunes(); return; }
  const tpos = t.closest("[data-tpos]");
  if (tpos) { T.pos = tpos.dataset.tpos; store.set("tpos", T.pos); render(); return; }
  const tmode = t.closest("[data-tmode]");
  if (tmode) { T.mode = tmode.dataset.tmode; T.err = null; render(); return; }
  const more = t.closest("[data-more]");
  if (more) { showMore[more.dataset.more] += 40; render(); return; }
  const tview = t.closest("[data-tview]");
  if (tview) { T.view = tview.dataset.tview; store.set("tview", T.view); render(); return; }
  if (t.closest("[data-refresh]")) { delete duosCache[state?.players?.[0]?.puuid]; post("/api/refresh"); toast("正在更新战绩…"); return; }
  const c = t.closest(".card[data-key]");
  if (c) { selected = c.dataset.key; fresh.drawer = true; showMore.drawer = 40; lastKey = ""; render(); }
});
document.addEventListener("input", e => { if (e.target.id === "csearch") { B.search = e.target.value; render(); } });
document.addEventListener("change", e => {
  if (e.target.id === "target") { B.target = e.target.value ? +e.target.value : null; B.auto = false; loadBuild(); }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (modal) modal = null; else if (selected) selected = null; else return;
  render();
});
async function importRunes(quiet = false) {
  const r = B.data ? curRune(B.data) : null;
  if (!r) return;
  const name = champName(B.champ) + (B.target ? " vs " + champName(B.target) : "");
  try {
    const res = await api("/api/runes", { method: "POST", body: JSON.stringify({
      name, primary: r.primary, secondary: r.secondary, perks: [...r.primaryRunes, ...r.secondaryRunes, ...(r.shards || [])] }) });
    const d = await res.json();
    toast(d.ok ? (quiet ? "已同步到客户端" : d.message || "已导入") : (d.message || "导入失败"), !d.ok);
  } catch (e) { toast("导入失败：" + e.message, true); }
}
async function setSpells(ids) {
  try {
    const res = await api("/api/spells", { method: "POST", body: JSON.stringify({ spell1: ids[0], spell2: ids[1] }) });
    const d = await res.json();
    toast(d.message || (d.ok ? "已设置" : "设置失败"), !d.ok);
  } catch (e) { toast("设置失败：" + e.message, true); }
}
$("#refresh").onclick = () => {
  if (tab === "build") { loadBuild(); return; }
  if (tab === "tier") { T.data = null; T.err = null; render(); return; }
  post("/api/refresh");
};
$("#pin").onclick = () => post("/api/settings", { topmost: !state?.settings.topmost });
$("#upd").onclick = () => { updOpen = true; render(); };
$("#ovl").onclick = () => {
  const on = state?.settings.overlay === false;
  post("/api/settings", { overlay: on });
  toast(on ? "已开启游戏内悬浮窗：进游戏自动显示（游戏需设为无边框或窗口模式）" : "已关闭游戏内悬浮窗");
};

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
