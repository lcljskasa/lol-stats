<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LOL 战绩速览</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #07090d;
  --card: #0d1117;
  --card-2: #121821;
  --card-3: #171f2a;
  --line: rgba(255, 255, 255, .06);
  --line-2: rgba(255, 255, 255, .11);
  --text: #ece6d8;
  --text-2: #a7a59e;
  --text-3: #6c6f75;
  --gold: #c8aa6e;
  --gold-hi: #f0e6d2;
  --gold-lo: #5b4521;
  --win: #5aa9ff;
  --loss: #ff5d6c;
  --mid: #d9b56b;
  --num: "Bahnschrift", "DIN Alternate", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body { font: 13px/1.45 "Microsoft YaHei UI", "Segoe UI", "PingFang SC", sans-serif; user-select: none; -webkit-font-smoothing: antialiased; }
.num { font-family: var(--num); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { display: block; }
.c-good { color: var(--win); } .c-bad { color: var(--loss); } .c-mid { color: var(--mid); } .c-dim { color: var(--text-3); } .c-gold { color: var(--gold); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .1); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }

/* ================= 标题栏 ================= */
.titlebar { height: 52px; display: flex; align-items: center; background: linear-gradient(#0b0e13, #080a0e);
            border-bottom: 1px solid var(--line); position: relative; z-index: 20; }
.drag { align-self: stretch; display: flex; align-items: center; }
.brand { gap: 11px; padding: 0 16px 0 20px; }
.mark { width: 18px; height: 18px; transform: rotate(45deg); border: 1.5px solid var(--gold); border-radius: 3px;
        display: grid; place-items: center; box-shadow: 0 0 14px rgba(200, 170, 110, .35); }
.mark::after { content: ""; width: 6px; height: 6px; background: var(--gold-hi); border-radius: 1px; }
.brand-name { font-size: 14px; font-weight: 600; letter-spacing: .12em; color: var(--gold-hi); }
.nav { display: flex; align-self: stretch; gap: 2px; padding: 0 6px; border-left: 1px solid var(--line); }
.nav button { position: relative; padding: 0 14px; font-size: 13px; color: var(--text-3); transition: color .15s; }
.nav button:hover { color: var(--text); }
.nav button.on { color: var(--gold-hi); }
.nav button.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--gold); border-radius: 2px; }
.status { gap: 8px; color: var(--text-3); font-size: 12px; padding: 0 14px; border-left: 1px solid var(--line); min-width: 0; }
.status b { color: var(--text-2); font-weight: 400; }
.led { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); flex: none; }
.led.ok { background: #3ddc97; box-shadow: 0 0 8px #3ddc97; }
.led.bad { background: var(--loss); box-shadow: 0 0 8px var(--loss); }
.status-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grow { flex: 1; }
.tools { display: flex; align-items: center; gap: 6px; padding-right: 8px; }
.seg { display: flex; padding: 2px; border-radius: 8px; background: rgba(255, 255, 255, .03); border: 1px solid var(--line); }
.seg button { padding: 4px 10px; border-radius: 6px; font-size: 12px; color: var(--text-3); transition: color .15s, background .15s; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button.on { color: var(--gold-hi); background: rgba(200, 170, 110, .12); }
.seg.count button { font-family: var(--num); min-width: 36px; }
.tbtn { height: 30px; padding: 0 10px; border-radius: 7px; display: inline-flex; align-items: center; gap: 6px;
        color: var(--text-2); font-size: 12px; transition: background .15s, color .15s, border-color .15s; white-space: nowrap; }
.tbtn:hover { background: rgba(255, 255, 255, .06); color: var(--text); }
.tbtn.on { color: var(--gold); }
.tbtn svg { width: 15px; height: 15px; }
.tbtn.primary { color: var(--gold-hi); border: 1px solid var(--gold-lo); background: linear-gradient(rgba(200, 170, 110, .12), rgba(200, 170, 110, .04)); }
.tbtn.primary:hover { border-color: var(--gold); }
.tbtn:disabled { opacity: .4; cursor: default; }
.winctl { display: flex; align-self: stretch; }
.winctl button { width: 46px; display: grid; place-items: center; color: var(--text-2); transition: background .12s, color .12s; }
.winctl button:hover { background: rgba(255, 255, 255, .07); color: var(--text); }
.winctl button.close:hover { background: #c42b1c; color: #fff; }
.winctl svg { width: 10px; height: 10px; }

main { height: calc(100vh - 52px); padding: 16px; position: relative; }
.panel { min-height: 0; display: flex; flex-direction: column; border-radius: 14px; background: var(--card); border: 1px solid var(--line); overflow: hidden; }
.panel-head { display: flex; align-items: baseline; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); flex: none; }
.panel-head h2 { font-size: 14px; font-weight: 600; color: var(--gold-hi); }
.panel-head span { font-size: 12px; color: var(--text-3); }
.panel-body { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px; }
.list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.list > * { flex: none; }

/* ================= 玩家卡 ================= */
.team { height: 100%; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.card { position: relative; display: flex; flex-direction: column; min-height: 0; overflow: hidden; border-radius: 14px;
        background: var(--card); border: 1px solid var(--line); cursor: pointer; transition: border-color .2s, transform .2s, box-shadow .2s; }
.card:hover { border-color: var(--line-2); transform: translateY(-3px); box-shadow: 0 18px 40px rgba(0, 0, 0, .5); }
.card.sel { border-color: var(--gold-lo); box-shadow: 0 0 0 1px var(--gold-lo), 0 18px 40px rgba(0, 0, 0, .5); }
.card.me { border-color: rgba(200, 170, 110, .28); }
.card.enter { animation: rise .45s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.hero { position: relative; flex: 0 0 40%; min-height: 190px; overflow: hidden; background: #0a0d12; }
.hero .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 14%; transition: transform .6s ease; }
.card:hover .hero .art { transform: scale(1.045); }
.hero.ghost .art { filter: grayscale(.85) brightness(.55); }
.hero::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(7, 9, 13, .35) 0%, transparent 28%, transparent 45%, rgba(13, 17, 23, .85) 80%, var(--card) 100%); }
.hero-top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; z-index: 2; }
.pos { font-size: 11px; letter-spacing: .14em; color: var(--gold-hi); padding: 3px 9px; border-radius: 999px;
       background: rgba(7, 9, 13, .55); border: 1px solid rgba(200, 170, 110, .35); backdrop-filter: blur(6px); }
.me-flag { font-size: 11px; color: #1a1408; background: var(--gold); padding: 3px 9px; border-radius: 999px; font-weight: 600; }
.hero-bottom { position: absolute; left: 16px; right: 16px; bottom: 12px; z-index: 2; }
.pick-name { font-size: 12px; color: var(--gold); letter-spacing: .06em; margin-bottom: 2px; text-shadow: 0 1px 6px #000; }
.pick-name.none { color: var(--text-3); }
.pname { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.pname b { font-size: 19px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 10px #000; }
.pname span { font-size: 12px; color: var(--text-2); flex: none; }
.rank { display: flex; align-items: center; gap: 7px; margin-top: 6px; font-size: 12px; color: var(--text-2); }
.gem { width: 9px; height: 9px; transform: rotate(45deg); border-radius: 2px; flex: none; }
.rank .tier { font-weight: 600; }
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 6px 16px 14px; }
.headline { display: flex; align-items: flex-end; justify-content: space-between; }
.big { font-size: 40px; line-height: 1; font-weight: 600; letter-spacing: -.01em; }
.big small { font-size: 20px; font-weight: 500; margin-left: 1px; }
.cap { font-size: 11px; color: var(--text-3); margin-top: 5px; letter-spacing: .04em; }
.kda { text-align: right; }
.kda .v { font-size: 22px; line-height: 1; font-weight: 600; }
.kda .s { font-size: 12px; color: var(--text-2); margin-top: 5px; }
.wl { display: flex; height: 4px; border-radius: 4px; overflow: hidden; margin: 12px 0 5px; background: var(--line); }
.wl .w { background: var(--win); } .wl .l { background: var(--loss); opacity: .85; }
.wl-text { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); }
.form { margin-top: 14px; }
.form-bar { display: flex; gap: 3px; margin-top: 6px; }
.form-bar i { flex: 1; height: 16px; border-radius: 3px; background: var(--line); }
.form-bar i.w { background: linear-gradient(var(--win), #2f6fb8); }
.form-bar i.l { background: linear-gradient(var(--loss), #a8303c); opacity: .9; }
.label { font-size: 11px; color: var(--text-3); letter-spacing: .04em; display: flex; justify-content: space-between; }
.notes { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; min-height: 18px; font-size: 12px; color: var(--text-2); }
.note::before { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; margin-right: 6px; vertical-align: middle; background: var(--text-3); }
.note.good::before { background: var(--win); } .note.bad::before { background: var(--loss); } .note.gold::before { background: var(--gold); }
.note.good { color: #9cc9ff; } .note.bad { color: #ff9aa3; } .note.gold { color: var(--gold-hi); }
.mini { flex: 1; min-height: 0; overflow: hidden; margin-top: 12px; display: flex; flex-direction: column; flex-wrap: wrap;
        align-content: flex-start; column-gap: 40px; row-gap: 3px; }
.mini > * { width: 100%; }
.mr { flex: none; display: grid; grid-template-columns: 2px 22px 1fr auto; align-items: center; gap: 8px; height: 28px;
      padding-right: 8px; border-radius: 6px; background: rgba(255, 255, 255, .025); overflow: hidden; }
.mr .e { align-self: stretch; }
.mr.w .e { background: var(--win); } .mr.l .e { background: var(--loss); }
.mr img, .mr .ph { width: 22px; height: 22px; border-radius: 5px; object-fit: cover; background: var(--card-2); }
.mr .n { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
.mr .n em { font-style: normal; color: var(--text-3); font-size: 11px; margin-left: 4px; }
.mr .s { font-family: var(--num); font-size: 12px; }
.d { color: var(--loss); }
.pool { padding-top: 10px; margin-top: 10px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.pc { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; }
.pc img, .pc .ph { width: 30px; height: 30px; border-radius: 7px; object-fit: cover; background: var(--card-2); border: 1px solid var(--line); }
.pc-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-sub { font-size: 11px; color: var(--text-3); }
.pc-wr { font-size: 15px; font-weight: 600; text-align: right; }
.sk { background: linear-gradient(90deg, #10151c 0%, #19212b 50%, #10151c 100%); background-size: 200% 100%;
      animation: shimmer 1.3s linear infinite; border-radius: 6px; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ================= 对局行（OP.GG 风格） ================= */
.g { display: grid; grid-template-columns: 3px 44px 40px 1fr 110px 196px 54px; align-items: center; gap: 10px;
     padding: 7px 14px 7px 0; border-radius: 10px; overflow: hidden; cursor: pointer; transition: filter .15s; }
.g:hover { filter: brightness(1.18); }
.g .edge { align-self: stretch; margin: -7px 0; }
.g.w { background: linear-gradient(90deg, rgba(90, 169, 255, .10), rgba(90, 169, 255, .03) 60%); }
.g.l { background: linear-gradient(90deg, rgba(255, 93, 108, .10), rgba(255, 93, 108, .03) 60%); }
.g.w .edge { background: var(--win); } .g.l .edge { background: var(--loss); }
.ch { position: relative; width: 44px; height: 44px; }
.ch img, .ch .ph { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: var(--card-2); }
.ch i { position: absolute; right: -3px; bottom: -3px; font: 600 10px var(--num); font-style: normal; background: #000; color: var(--text-2);
        border-radius: 5px; padding: 0 4px; border: 1px solid var(--line-2); }
.sp { display: grid; grid-template-columns: 19px 19px; gap: 2px; }
.sp img, .sp .ph { width: 19px; height: 19px; border-radius: 4px; background: var(--card-2); }
.g .t1 { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g .t2 { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g .res { font-size: 12px; font-weight: 600; margin-left: 6px; }
.g .k .t1 { font-family: var(--num); font-size: 15px; font-weight: 600; }
.items { display: flex; gap: 2px; }
.items img, .items .ph { width: 26px; height: 26px; border-radius: 5px; background: rgba(255, 255, 255, .04); }
.g .cs { text-align: right; }

/* ================= 抽屉 / 弹窗 ================= */
.scrim { position: absolute; inset: 0; background: rgba(4, 6, 9, .6); backdrop-filter: blur(3px); z-index: 30; }
.scrim.enter { animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(760px, 62%); z-index: 31; background: #0b0f14;
          border-left: 1px solid var(--line-2); display: flex; flex-direction: column; box-shadow: -30px 0 60px rgba(0, 0, 0, .5); }
.drawer.enter { animation: slide .28s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.banner { position: relative; height: 140px; flex: none; overflow: hidden; }
.banner img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11, 15, 20, .1), #0b0f14); }
.banner-text { position: absolute; left: 20px; bottom: 12px; right: 60px; z-index: 2; }
.banner-text b { font-size: 20px; color: #fff; font-weight: 600; text-shadow: 0 2px 10px #000; }
.banner-text div { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.x { position: absolute; top: 12px; right: 12px; z-index: 3; width: 32px; height: 32px; border-radius: 50%;
     display: grid; place-items: center; background: rgba(7, 9, 13, .6); color: var(--text-2); }
.x:hover { color: #fff; background: rgba(7, 9, 13, .85); }
.x svg { width: 12px; height: 12px; }
.modal { position: absolute; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(1080px, calc(100% - 40px));
         max-height: calc(100% - 30px); display: flex; flex-direction: column; background: #0b0f14; border: 1px solid var(--line-2);
         border-radius: 16px; box-shadow: 0 30px 80px rgba(0, 0, 0, .6); overflow: hidden; }
.modal.enter { animation: pop .22s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -48%) scale(.98); } }
.scrim.top { z-index: 40; position: fixed; }
#overlay .modal { position: fixed; top: calc(50% + 26px); max-height: calc(100vh - 90px); }
.mhead { display: flex; align-items: center; gap: 14px; padding: 16px 60px 16px 20px; border-bottom: 1px solid var(--line); position: relative; flex-wrap: wrap; }
.mhead h2 { font-size: 16px; }
.mhead span { color: var(--text-3); font-size: 12px; }
.mhead .x { top: 50%; transform: translateY(-50%); right: 14px; }
.mbody { flex: 1; min-height: 0; overflow: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.mbody > * { flex: none; }
.tside { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.tside-h { display: flex; align-items: center; gap: 14px; padding: 9px 14px; font-size: 12px; color: var(--text-2); }
.tside-h b { font-size: 13px; }
.tside.w .tside-h { background: rgba(90, 169, 255, .08); } .tside.l .tside-h { background: rgba(255, 93, 108, .08); }
.tside.w .tside-h b { color: var(--win); } .tside.l .tside-h b { color: var(--loss); }
.prow, .hcols { display: grid; grid-template-columns: 40px 40px 26px minmax(110px, 1fr) 54px 100px 120px 50px 56px 40px 188px; align-items: center; gap: 10px; padding: 6px 14px; }
.prow { border-top: 1px solid var(--line); }
.hcols { font-size: 11px; color: var(--text-3); padding-top: 4px; padding-bottom: 4px; }
.prow.focus { background: rgba(200, 170, 110, .07); }
.prow .ch, .prow .ch img, .prow .ch .ph { width: 40px; height: 40px; }
.prow .who { min-width: 0; }
.prow .who b { display: block; font-weight: 500; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .who span { font-size: 11px; color: var(--text-3); }
.keyst { display: grid; gap: 2px; justify-items: center; }
.keyst img, .keyst .ph { width: 26px; height: 26px; border-radius: 50%; background: #000; }
.keyst img + img { width: 16px; height: 16px; }
.score { text-align: center; }
.score b { font: 600 16px var(--num); }
.badge { display: inline-block; font: 700 10px var(--num); letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; margin-top: 2px; }
.badge.mvp { background: var(--gold); color: #1a1408; } .badge.ace { background: #8f6bd8; color: #fff; }
.bar2 { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; margin-top: 4px; }
.bar2 > div { height: 100%; background: linear-gradient(90deg, #d5504f, #ff8a65); }
.cell { font-size: 12px; text-align: right; }
.cell small { display: block; font-size: 11px; color: var(--text-3); }
.prow .items img, .prow .items .ph { width: 24px; height: 24px; }

/* ================= 我的页 ================= */
.me-grid { height: 100%; display: grid; grid-template-columns: 290px 1fr; gap: 14px; }
.me-grid .card { cursor: default; } .me-grid .card:hover { transform: none; box-shadow: none; }
.me-right { min-height: 0; display: grid; grid-template-rows: 200px 1fr; gap: 14px; }
.me-top { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 14px; min-height: 0; }
.me-bottom { display: grid; grid-template-columns: 1fr 1.6fr; gap: 14px; min-height: 0; }
.posbar { display: grid; grid-template-columns: 34px 1fr 80px; align-items: center; gap: 10px; font-size: 12px; margin-bottom: 9px; }
.posbar .track { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; }
.posbar .track div { height: 100%; background: linear-gradient(90deg, var(--gold-lo), var(--gold)); border-radius: 8px; }
.posbar .v { text-align: right; color: var(--text-2); }
.trend svg { width: 100%; height: 112px; display: block; }
.trend-legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); margin-top: 4px; }
.duo { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 5px 0; }
.duo img, .duo .ph { width: 30px; height: 30px; border-radius: 50%; background: var(--card-2); }
.duo b { font-weight: 500; font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.duo span { font-size: 11px; color: var(--text-3); }
table.t { width: 100%; border-collapse: collapse; font-size: 12px; }
table.t th { white-space: nowrap; position: sticky; top: 0; background: var(--card); text-align: right; font-weight: 400; color: var(--text-3); padding: 8px 10px; border-bottom: 1px solid var(--line); z-index: 1; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--line); font-family: var(--num); }
table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: rgba(255, 255, 255, .03); }
.cn { display: flex; align-items: center; gap: 10px; font-family: "Microsoft YaHei UI", sans-serif; }
.cn img, .cn .ph { width: 28px; height: 28px; border-radius: 7px; background: var(--card-2); }
.me-grid .g { grid-template-columns: 3px 44px 40px 1fr 100px 188px; }
.me-grid .g .cs { display: none; }

/* ================= 出装 · 对位页 ================= */
.build { height: 100%; display: grid; grid-template-columns: 250px 1fr; gap: 14px; }
.picker { display: flex; flex-direction: column; }
.search { margin: 12px 12px 8px; height: 34px; border-radius: 9px; background: var(--card-2); border: 1px solid var(--line);
          color: var(--text); padding: 0 12px; font: inherit; outline: none; }
.search:focus { border-color: var(--gold-lo); }
.quick { padding: 0 12px 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 3px; border-radius: 8px; background: rgba(200, 170, 110, .08);
                border: 1px solid var(--gold-lo); font-size: 12px; color: var(--gold-hi); }
.quick button.enemy { background: rgba(255, 93, 108, .08); border-color: rgba(255, 93, 108, .35); color: #ffb3ba; }

<script>
const TOKEN = "__APP_TOKEN__";
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { "X-App-Token": TOKEN } });
async function getJSON(path) {
  const r = await api(path);
  const d = await r.json();
  if (!r.ok || (d && d.error)) throw new Error((d && d.error) || ("HTTP " + r.status));
  return d;
}

const QUEUES = { 420: "单双排", 440: "灵活排", 400: "匹配", 430: "匹配", 490: "快速匹配", 450: "大乱斗",

const MODE_NAMES = { all: "", rank: "排位", normal: "匹配", aram: "大乱斗" };
const POS = { top: "上单", jungle: "打野", middle: "中单", bottom: "ADC", utility: "辅助" };
const POS_ORDER = ["top", "jungle", "middle", "bottom", "utility"];
const OTIER_NAMES = { all: "全段位", platinum_plus: "铂金以上", emerald_plus: "翡翠以上", diamond_plus: "钻石以上", master_plus: "大师以上" };
const TIER_COLORS = { IRON: "#8a7d76", BRONZE: "#c08560", SILVER: "#aab7c2", GOLD: "#e6be5f", PLATINUM: "#4fc7b5",
  EMERALD: "#43c985", DIAMOND: "#86aeff", MASTER: "#c784ff", GRANDMASTER: "#ff6e6e", CHALLENGER: "#f6d683" };

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

let state = null, assets = { champions: {}, items: {}, perks: {}, styles: {}, spells: {} }, assetsFor = null;
let tab = store.get("tab", "team"), mode = store.get("mode", "all"), otier = store.get("otier", "emerald_plus");
let selected = null, lastKey = "", lastPhase = null;
const fresh = { drawer: false, modal: false };
const seen = new Set();
// 出装页状态
const B = { champ: store.get("bchamp", 145), pos: null, target: null, mode: "ranked", data: null, err: null, loading: false,
            mu: null, runeIdx: 0, search: "", auto: true, autoKey: null, reqId: 0 };
// 梯队页状态

const duosCache = {};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const champName = id => assets.champions[id] || "";
const pct = x => Math.round(x * 100);
const pct1 = x => x == null ? "--" : (x * 100).toFixed(1) + "%";
const tone = (wr, n) => n < 5 ? "c-dim" : wr >= .55 ? "c-good" : wr < .45 ? "c-bad" : "c-mid";
const wrTone = wr => wr == null ? "" : wr >= .52 ? "c-good" : wr < .48 ? "c-bad" : "";
const art = (kind, id) => `/art/${kind}/${id}`;
function img(kind, id, cls = "", title = "") {
  if (!id) return `<div class="ph ${cls}"></div>`;
  return `<img class="${cls}" src="${art(kind, id)}" alt="" title="${esc(title)}" onerror="this.style.visibility='hidden'">`;
}
const itemImg = id => img("item", id, "", assets.items[id]);
const perkImg = (id, cls = "") => img("perk", id, cls, assets.perks[id]);
const spellImg = id => img("spell", id, "", assets.spells[id]);
const styleImg = id => img("style", id, "", assets.styles[id]);

function ago(t) {
  const m = (Date.now() - t) / 60000;
  if (m < 60) return Math.max(1, Math.round(m)) + " 分钟前";
  if (m < 1440) return Math.round(m / 60) + " 小时前";
  if (m < 43200) return Math.round(m / 1440) + " 天前";
  return new Date(t).toLocaleDateString("zh-CN");
}
let toastTimer;
function toast(msg, bad = false) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2600);
}

/* ---------------- 战绩统计 ---------------- */
function stats(p) {
  const qs = MODES[mode];
  const gs = (p.games || []).filter(g => g.dur >= 300 && (!qs || qs.includes(g.q))).slice(0, state.settings.games);
  const n = gs.length;
  if (!n) return { n: 0, gs, champs: [] };
  const wins = gs.filter(g => g.win).length;
  const sum = k => gs.reduce((a, g) => a + (g[k] || 0), 0);
  const [k, d, a] = ["k", "d", "a"].map(sum);
  const by = {};
  for (const g of gs) {
    const c = by[g.c] ??= { id: g.c, n: 0, w: 0, k: 0, d: 0, a: 0, cs: 0, min: 0, dmg: 0 };
    c.n++; c.w += g.win; c.k += g.k; c.d += g.d; c.a += g.a; c.cs += g.cs; c.min += g.dur / 60; c.dmg += g.dmg || 0;
  }
  const champs = Object.values(by).sort((x, y) => y.n - x.n || y.w - x.w);
  let streak = 0;
  for (const g of gs) { if (g.win === gs[0].win) streak++; else break; }
  const all = (p.games || []).length;
  return { n, gs, wins, wr: wins / n, kda: (k + a) / Math.max(d, 1), avg: [k / n, d / n, a / n],
           champs, streak, streakWin: gs[0].win, aramShare: all ? p.games.filter(g => g.q === 450).length / all : 0 };
}
function notes(p, s) {
  const t = [];
  if (s.streak >= 3) t.push(s.streakWin ? ["good", `${s.streak} 连胜`] : ["bad", `${s.streak} 连败`]);
  const top = s.champs[0];
  if (top && s.n >= 10 && top.n / s.n >= .4) t.push(["gold", `绝活 ${champName(top.id)}`]);
  if (p.champ) {
    const c = s.champs.find(c => c.id === p.champ);
    if (!c && s.n >= 10) t.push(["bad", "本局英雄近期没玩过"]);
    else if (c && c.n >= 5) t.push([c.w / c.n >= .55 ? "good" : c.w / c.n < .45 ? "bad" : "", `本局英雄 ${c.w}胜${c.n - c.w}负`]);
  }
  if (s.n >= 10 && s.kda >= 4) t.push(["good", "数据亮眼"]);
  if (mode === "all" && s.aramShare > .5) t.push(["", "常玩大乱斗"]);
  return t.slice(0, 3);
}
function rankLine(r) {
  if (!r) return `<span class="c-dim">段位未知</span>`;
  if (!r.tier) return `<span class="gem" style="background:#3a3f47"></span><span class="c-dim">${esc(r.text)}</span>`;
  const games = r.wins + r.losses, color = TIER_COLORS[r.tier] || "var(--text)";
  return `<span class="gem" style="background:${color};box-shadow:0 0 8px ${color}"></span>`
    + `<span class="tier" style="color:${color}">${esc(r.text)}</span><span class="num">${r.lp} 点</span>`
    + (games ? `<span class="c-dim num">· 赛季 ${pct(r.wins / games)}%</span>` : "");
}

function card(p, { clickable = true, solo = false } = {}) {

/* ---------------- 我的页 ---------------- */
function trendSvg(gs) {
  // 滚动胜率（最近 10 场为一个窗口），从旧到新
  const arr = gs.slice().reverse(), pts = [];
  for (let i = 0; i < arr.length; i++) {
    const w = arr.slice(Math.max(0, i - 9), i + 1);
    pts.push(w.filter(g => g.win).length / w.length);
  }
  if (pts.length < 2) return '<p class="hint">对局太少</p>';
  const W = 400, H = 112, x = i => i / (pts.length - 1) * W, y = v => H - 8 - v * (H - 16);
  const d = pts.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="0" x2="${W}" y1="${y(.5)}" y2="${y(.5)}" stroke="rgba(255,255,255,.14)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
    <path d="${d}L${W},${H}L0,${H}Z" fill="rgba(200,170,110,.10)"/>
    <path d="${d}" fill="none" stroke="#c8aa6e" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function meView() {
  const p = state.view === "self" ? (state.players || [])[0] : null;
  if (!p) return `<div class="loading"><div><div class="spin"></div>${state.connected ? "正在读取你的战绩…" : "未连接到客户端"}</div></div>`;
  if (p.loading) return `<div class="me-grid">${card(p, { clickable: false, solo: true })}<div class="loading"><div><div class="spin"></div>正在读取…</div></div></div>`;
  if (p.error) return `<div class="me-grid">${card(p, { clickable: false, solo: true })}<div class="loading">${esc(p.error)}</div></div>`;
  const s = stats(p);
  const byPos = {};
  for (const g of s.gs) if (g.pos) { const x = byPos[g.pos] ??= { n: 0, w: 0 }; x.n++; x.w += g.win; }
  const posMax = Math.max(1, ...Object.values(byPos).map(x => x.n));
  const posHtml = POS_ORDER.map(k => {

      <span class="v num">${x.n} 场 ${x.n ? `<b class="${tone(x.w / x.n, x.n)}">${pct(x.w / x.n)}%</b>` : ""}</span></div>`;
  }).join("") + (Object.keys(byPos).length ? "" : '<p class="hint">大乱斗等模式没有位置信息</p>');
  const duos = duosCache[p.puuid];

    : duos.map(d => `<div class="duo">${img("profile", d.icon)}<div style="min-width:0"><b>${esc(d.name)}<span> #${esc(d.tag)}</span></b>
        <span class="num">一起 ${d.n} 场 · ${d.w} 胜</span></div><b class="num ${tone(d.w / d.n, 5)}">${pct(d.w / d.n)}%</b></div>`).join("");
  const rows = s.champs.map(c => `<tr class="click" data-build="${c.id}">
      <td><div class="cn">${img("square", c.id)}${esc(champName(c.id))}</div></td><td>${c.n}</td>
      <td class="${tone(c.w / c.n, c.n >= 3 ? 5 : 0)}">${pct(c.w / c.n)}%</td>
      <td>${((c.k + c.a) / Math.max(c.d, 1)).toFixed(2)}</td><td>${(c.cs / Math.max(c.min, 1)).toFixed(1)}</td>
      <td>${Math.round(c.dmg / c.n).toLocaleString()}</td></tr>`).join("");
  return `<div class="me-grid">${card(p, { clickable: false, solo: true })}

        <section class="panel"><div class="panel-head"><h2>胜率走势</h2><span>每 10 场滚动</span></div>
          <div class="panel-body trend">${trendSvg(s.gs)}<div class="trend-legend"><span>较早</span><span>虚线 = 50%</span><span>最近</span></div></div></section>
        <section class="panel"><div class="panel-head"><h2>常一起玩</h2><span>近 20 场</span></div><div class="panel-body" style="padding-top:6px">${duoHtml}</div></section>

      </div>
    </div></div>`;

async function loadDuos(puuid) {
  duosCache[puuid] = undefined;
  try { duosCache[puuid] = await getJSON(`/api/duos?puuid=${encodeURIComponent(puuid)}`); }
  catch (e) { duosCache[puuid] = { error: "读取失败：" + e.message }; }
  if (tab === "me") render();
}

/* ---------------- 出装 · 对位页 ---------------- */
async function loadBuild() {
  const id = ++B.reqId;
  B.loading = true; B.err = null; B.runeIdx = 0;
  if (tab === "build") render();
  try {
    const q = new URLSearchParams({ champ: B.champ, mode: B.mode, tier: otier });
    if (B.pos) q.set("pos", B.pos);
    if (B.target && B.mode === "ranked") q.set("target", B.target);
    const d = await getJSON("/api/opgg/build?" + q);
    if (id !== B.reqId) return;
    B.data = d; B.pos = d.pos;
    B.mu = null;
    if (B.target && B.pos && B.mode === "ranked") {
      const m = new URLSearchParams({ champ: B.champ, pos: B.pos, enemy: B.target, tier: otier });
      B.mu = await getJSON("/api/opgg/matchup?" + m).catch(e => ({ error: e.message }));
    }
  } catch (e) { if (id === B.reqId) B.err = e.message; }
  if (id !== B.reqId) return;
  B.loading = false;
  if (tab === "build") render();
}
/* 进入选英雄时：用我的英雄和位置，并推断对位的敌人 */
async function autoBuild() {
  const pk = state.pick || {};
  B.champ = pk.champ || B.champ; B.pos = pk.pos || null; B.target = null; B.mode = pk.aram ? "aram" : "ranked";
  if (!pk.aram && pk.pos && pk.enemies?.length) {
    try {
      const q = new URLSearchParams({ pos: pk.pos, enemies: pk.enemies.join(","), tier: otier });
      if (pk.champ) q.set("champ", pk.champ);
      const mu = await getJSON("/api/opgg/matchup?" + q);
      if (mu.enemy) B.target = mu.enemy;
    } catch (e) {}
  }
  loadBuild();
}

function runeBox(d) {
  const r = d.runes[B.runeIdx] || d.runes[0];
  if (!r) return `<div class="box rune"><h3>推荐符文</h3><p class="hint">暂无数据</p></div>`;
  const pages = d.runes.map((x, i) => `<button class="rpage${i === B.runeIdx ? " on" : ""}" data-rune="${i}">

    <div class="rune-wrap"><div class="rpages">${pages}</div>
      <div class="tree">
        <div class="tcol"><div class="thead">${styleImg(r.primary)}${esc(assets.styles[r.primary] || "")}</div>
          ${pRows.length ? row(pRows[0], "key") + '<div class="tsep"></div>' + pRows.slice(1).map(ids => row(ids)).join("")

}
function skillBox(d) {
  const s = d.skills;
  if (!s) return `<div><h4>技能加点</h4><p class="hint">暂无数据</p></div>`;
  const ab = k => `<div class="ab"><img src="/art/ability/${d.champ}/${k.toLowerCase()}" alt="" onerror="this.style.visibility='hidden'"><b class="${k}">${k}</b></div>`;
  const grid = ["Q", "W", "E", "R"].map(k => `<i class="k"><img src="/art/ability/${d.champ}/${k.toLowerCase()}" alt="${k}" title="${k}" onerror="this.replaceWith(document.createTextNode('${k}'))"></i>`
    + Array.from({ length: 15 }, (_, i) => `<i class="${s.order?.[i] === k ? "on " + k : ""}">${i + 1}</i>`).join("")).join("");
  return `<div><h4>技能加点</h4>
    <div class="sk-prio">${(s.priority || []).map((k, i) => (i ? '<span class="arrow">›</span>' : "") + ab(k)).join("")}
      <div class="meta"><b class="${wrTone(s.win)}">${pct1(s.win)}</b>胜率 · 选取 ${pct1(s.pick)}</div></div>
    <div class="skills">${grid}</div></div>`;
}
function spellBox(d) {
  if (!d.spells?.length) return "";
  return `<div><h4>召唤师技能</h4><table class="ot"><thead><tr><th></th><th>选取率</th><th>胜率</th></tr></thead><tbody>
    ${d.spells.map(x => `<tr><td><div class="ic">${x.ids.map(spellImg).join("")}<span class="c-dim" style="font:400 12px 'Microsoft YaHei UI';margin-left:6px">${x.ids.map(id => esc(assets.spells[id] || "")).join(" + ")}</span></div></td>
      <td>${pct1(x.pick)}<small>${(x.play || 0).toLocaleString()} 场</small></td><td class="${wrTone(x.win)}">${pct1(x.win)}</td></tr>`).join("")}</tbody></table></div>`;
}
function itemsBox(d) {
  const late = (d.last || []).map(x => `<div>${itemImg(x.ids[0])}${pct1(x.pick)}</div>`).join("");
  return `<div class="box wide"><h3>出装${B.target ? ` <span>针对 ${esc(champName(B.target))}</span>` : ""}</h3>
    <div class="items3">${itemTable("出门装", d.starter, false)}${itemTable("鞋子", d.boots, false)}${itemTable("核心出装", d.core)}</div>
    ${late ? `<h4 style="margin-top:14px">后期可选（按选取率）</h4><div class="late">${late}</div>` : ""}</div>`;
}
function counterList(list, good) {
  return list.map(c => `<div class="crow" data-target="${c.id}" title="查看针对 ${esc(champName(c.id))} 的出装">${img("square", c.id)}<div><b>${esc(champName(c.id))}</b>
      <span class="num">${c.play.toLocaleString()} 场</span></div><div class="r ${good ? "c-good" : "c-bad"}">${pct1(c.win)}</div></div>`).join("")
    || '<p class="hint">暂无数据</p>';
}
function trendBox(d) {
  const t = d.trend || [];
  if (t.length < 2) return "";
  const W = 300, H = 110, vals = t.map(x => x.win), lo = Math.min(...vals) - .005, hi = Math.max(...vals) + .005;
  const x = i => 16 + i / (t.length - 1) * (W - 32), y = v => H - 24 - (v - lo) / (hi - lo) * (H - 40);
  const path = vals.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const dots = vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#c8aa6e"/><text x="${x(i)}" y="${H - 6}" fill="#6c6f75" font-size="10" text-anchor="middle">${t[i].v}</text>`).join("");
  return `<div class="box third"><h3>版本胜率走势</h3><div class="trendline"><svg viewBox="0 0 ${W} ${H}">
    <path d="${path}" fill="none" stroke="#c8aa6e" stroke-width="2"/>${dots}</svg></div>
    <p class="hint num">${t.slice(-3).map(x => pct1(x.win)).join(" → ")}</p></div>`;
}
function matchupBox() {
  if (B.mode !== "ranked") return "";

  if (!B.target) {
    return `<div class="box wide"><h3>对位推荐</h3><p class="hint">在右上角选择对线的对手，就能看到克制它的英雄，以及针对它的符文和出装。${pk.enemies?.length ? "" : "进入选英雄后会自动识别对面的对位英雄。"}也可以点下面“难打 / 好打的对手”里的英雄。</p></div>`;
  }
  const mu = B.mu;
  if (!mu) return `<div class="box wide"><h3>对位推荐</h3><div class="spin"></div></div>`;
  if (mu.error) return `<div class="box wide"><h3>对位推荐</h3><p class="hint">读取失败：${esc(mu.error)}</p></div>`;
  const mine = mu.mine;
  const picks = (mu.picks || []).map(c => `<button class="${c.id === B.champ ? "on" : ""}" data-pick="${c.id}" data-keep>${img("square", c.id)}
      <span>${esc(champName(c.id))}</span><b class="${wrTone(c.win)}">${pct1(c.win)}</b><small class="num">${c.play.toLocaleString()} 场</small></button>`).join("");
  return `<div class="box wide"><h3>对位推荐 <span>${POS[B.pos] || ""}对线 ${esc(champName(B.target))}${mu.guessed ? "（按对面阵容推断）" : ""} · 点推荐英雄，下面的符文和出装会切换成它打 ${esc(champName(B.target))} 的版本</span></h3>
    <div class="mu">
      <div class="mu-vs">${img("square", B.champ, "", champName(B.champ))}<div class="v">${esc(champName(B.champ))} 的胜率<b class="${wrTone(mine?.win)}">${mine ? pct1(mine.win) : "--"}</b>${mine ? mine.play.toLocaleString() + " 场" : "样本不足"}</div>${img("square", B.target, "", champName(B.target))}</div>
      <div><div class="hint" style="margin-bottom:8px">打 ${esc(champName(B.target))} 胜率最高的${POS[B.pos] || "英雄"}</div><div class="mu-picks">${picks || '<p class="hint">暂无数据</p>'}</div></div>
    </div></div>`;
}
function buildView() {
  const list = Object.entries(assets.champions).map(([id, n]) => [+id, n]).sort((a, b) => a[1].localeCompare(b[1], "zh"));
  const kw = B.search.trim().toLowerCase();
  const shown = kw ? list.filter(([, n]) => n.toLowerCase().includes(kw)) : list;
  const pk = state.pick || {};

    .map(([t, id]) => t === "mine" ? `<button data-pick="${id}" title="我的英雄">${img("square", id)}${esc(champName(id))}</button>`
                                  : `<button class="enemy" data-target="${id}" title="设为对位对手">${img("square", id)}${esc(champName(id))}</button>`).join("");
  const grid = shown.map(([id, n]) => `<button class="${id === B.champ ? "on" : ""}" data-pick="${id}">${img("square", id)}<span>${esc(n)}</span></button>`).join("");
  const picker = `<section class="panel picker"><input class="search" id="csearch" placeholder="搜索英雄" value="${esc(B.search)}">
    ${quick ? `<div class="quick">${quick}</div>` : ""}<div class="cgrid" data-scroll="cgrid">${grid}</div></section>`;

  let main;
  const d = B.data;
  if (B.err) main = `<div class="loading"><div>读取 OP.GG 数据失败：${esc(B.err)}<br><br><button class="tbtn primary" data-retry>重试</button></div></div>`;
  else if (!d) main = `<div class="loading"><div><div class="spin"></div>正在读取 OP.GG 数据…</div></div>`;
  else {
    const enemies = [...new Set([...(pk.enemies || []), ...(B.target ? [B.target] : [])])];
    const opts = `<option value="">不限对手（全部对局）</option>`
      + (pk.enemies?.length ? `<optgroup label="对面已选">${pk.enemies.map(e => `<option value="${e}" ${e === B.target ? "selected" : ""}>${esc(champName(e))}</option>`).join("")}</optgroup>` : "")
      + `<optgroup label="全部英雄">${list.map(([id, n]) => `<option value="${id}" ${id === B.target && !(pk.enemies || []).includes(id) ? "selected" : ""}>${esc(n)}</option>`).join("")}</optgroup>`;
    const st = d.stats || {};
    const ptabs = B.mode === "ranked" ? (d.positions || []).map(p => `<button class="${p.pos === B.pos ? "on" : ""}" data-bpos="${p.pos}">${POS[p.pos]}<small>${pct(p.role || 0)}%</small></button>`).join("") : "";
    const few = B.target && d.sample < 300;
    main = `<div class="bmain" data-scroll="bmain" style="${B.loading ? "opacity:.55;pointer-events:none" : ""}">
      <div class="bhero">${img("splash", d.champ)}<div class="bhero-in">${img("square", d.champ)}
        <div style="min-width:0"><h1>${esc(champName(d.champ))}${st.tier ? `<span class="tierb tb${st.tier}">T${st.tier}</span>` : ""}
          <span class="c-dim" style="font-size:13px;font-weight:400">${B.mode === "aram" ? "大乱斗" : (POS[d.pos] || "")}${st.rank ? ` · 第 ${st.rank} 名` : ""}</span></h1>
          <div class="kpis"><div>胜率<b class="${wrTone(st.win)}">${pct1(st.win)}</b></div><div>选取率<b>${pct1(st.pick)}</b></div>
            <div>禁用率<b>${pct1(st.ban)}</b></div><div>KDA<b>${st.kda ? st.kda.toFixed(2) : "--"}</b></div><div>样本<b>${(st.play || 0).toLocaleString()}</b></div></div>
          <div class="ptabs">${ptabs}<button class="${B.mode === "aram" ? "on" : ""}" data-bmode="${B.mode === "aram" ? "ranked" : "aram"}">${B.mode === "aram" ? "返回排位" : "大乱斗"}</button></div></div>
        ${B.mode === "ranked" ? `<div class="vs"><label>对位对手</label><select class="sel" id="target">${opts}</select>
          ${B.target ? `<span class="${few ? "warn" : "hint"}">针对 ${esc(champName(B.target))}：${(d.sample || 0).toLocaleString()} 场${few ? "，样本少仅供参考" : ""}</span>` : ""}</div>` : ""}
      </div></div>
      <div class="og">
        ${matchupBox()}
        ${runeBox(d)}
        <div class="box">${spellBox(d)}</div>
        <div class="box">${skillBox(d)}</div>
        ${itemsBox(d)}
        ${B.mode === "ranked" ? `<div class="box third"><h3>难打的对手 <span>点击查看针对它的出装</span></h3><div class="clist">${counterList(d.hard, false)}</div></div>

        ${trendBox(d)}
      </div>
      <p class="hint" style="padding:0 4px 6px">数据来自 OP.GG（${OTIER_NAMES[otier]}，全球服），每 30 分钟更新一次。</p>
    </div>`;
  }
  return `<div class="build">${picker}${main}</div>`;
}

/* ---------------- 梯队页 ---------------- */
async function loadTiers() {
  const key = T.mode + otier;
  T.loading = true; T.err = null;
  try { T.rows = await getJSON(`/api/opgg/tiers?mode=${T.mode}&tier=${otier}`); T.key = key; }
  catch (e) { T.err = e.message; }
  T.loading = false;
  if (tab === "tier") render();
}
function tierView() {
  if ((!T.rows || T.key !== T.mode + otier) && !T.loading && !T.err) loadTiers();
  const tabs = (T.mode === "ranked" ? POS_ORDER.map(k => `<button class="${T.pos === k ? "on" : ""}" data-tpos="${k}">${POS[k]}</button>`).join("") : "")
    + `<button class="${T.mode === "aram" ? "on" : ""}" data-tmode="${T.mode === "aram" ? "ranked" : "aram"}">${T.mode === "aram" ? "返回排位" : "大乱斗"}</button>`;
  let body;
  if (T.err) body = `<div class="loading"><div>读取失败：${esc(T.err)}<br><br><button class="tbtn primary" data-tretry>重试</button></div></div>`;
  else if (!T.rows || T.key !== T.mode + otier) body = `<div class="loading"><div><div class="spin"></div>正在读取 OP.GG 梯队…</div></div>`;
  else {
    const rows = T.rows.filter(r => T.mode === "aram" || r.pos === T.pos).sort((a, b) => (a.rank || 999) - (b.rank || 999));
    body = `<div class="panel-body" style="padding:0" data-scroll="tiers"><table class="t"><thead><tr><th>英雄</th><th>梯队</th><th>胜率</th><th>选取率</th><th>禁用率</th><th>KDA</th><th>排名变化</th></tr></thead><tbody>
      ${rows.map(r => {
        const ch = r.prev && r.rank ? r.prev - r.rank : 0;
        return `<tr class="click" data-build="${r.id}" data-pos="${r.pos}"><td><div class="cn"><span class="rk">${r.rank || "-"}</span>${img("square", r.id)}${esc(champName(r.id) || "#" + r.id)}</div></td>
          <td><span class="tierb tb${r.tier ?? 5}">T${r.tier ?? "-"}</span></td><td class="${wrTone(r.win)}">${pct1(r.win)}</td><td>${pct1(r.pick)}</td>
          <td>${pct1(r.ban)}</td><td>${r.kda ? r.kda.toFixed(2) : "--"}</td>
          <td class="chg ${ch > 0 ? "c-good" : ch < 0 ? "c-bad" : "c-dim"}">${ch > 0 ? "▲ " + ch : ch < 0 ? "▼ " + -ch : "—"}</td></tr>`;
      }).join("")}</tbody></table></div>`;
  }
  return `<div class="tierpage"><div class="tierbar"><div class="seg">${tabs}</div><span class="hint">数据来自 OP.GG 全球服（${OTIER_NAMES[otier]}）· 点英雄查看出装</span></div>
    <section class="panel">${body}</section></div>`;
}

/* ---------------- 单局详情弹窗 ---------------- */
async function openGame(id, focus) {
  modal = { id, focus, data: null, err: null };
  fresh.modal = true;
  render();
  try { const d = await getJSON(`/api/game/${id}`); if (modal?.id === id) modal.data = d; }
  catch (e) { if (modal?.id === id) modal.err = e.message; }
  if (modal?.id === id) render();
}
function gameModal() {
  if (!modal) return "";
  const enter = fresh.modal ? " enter" : "";
  fresh.modal = false;
  const close = `<button class="x" data-close="modal"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.5"/></svg></button>`;
  const d = modal.data;
  let inner;
  if (modal.err) inner = `<div class="mhead"><h2>读取失败</h2><span>${esc(modal.err)}</span>${close}</div>`;
  else if (!d) inner = `<div class="mhead"><h2>对局详情</h2><span>读取中…</span>${close}</div><div class="loading" style="height:200px"><div class="spin"></div></div>`;
  else {
    const me = d.players.find(p => p.puuid === modal.focus);
    const maxDmg = Math.max(...d.players.map(p => p.dmg), 1);
    const min = Math.max(d.dur / 60, 1);
    const side = t => {
      const ps = d.players.filter(p => p.team === t.id);
      return `<div class="tside ${t.win ? "w" : "l"}"><div class="tside-h"><b>${t.win ? "胜利" : "失败"}</b><span>${t.id === 100 ? "蓝色方" : "红色方"}</span>
        <span class="num">击杀 ${t.kills}</span><span class="num">经济 ${(t.gold / 1000).toFixed(1)}k</span>
        <span class="num">推塔 ${t.towers}</span><span class="num">小龙 ${t.dragons}</span><span class="num">大龙 ${t.barons}</span></div>
        <div class="hcols"><span></span><span></span><span></span><span>玩家</span><span style="text-align:center">评分</span><span style="text-align:right">KDA</span>
          <span>伤害</span><span style="text-align:right">经济</span><span style="text-align:right">补刀</span><span style="text-align:right">视野</span><span>装备</span></div>
        ${ps.map(p => `<div class="prow${p.puuid && p.puuid === modal.focus ? " focus" : ""}">
          <div class="ch">${img("square", p.c)}<i>${p.lvl}</i></div>
          <div class="sp">${(p.spells || []).map(spellImg).join("")}</div>
          <div class="keyst">${perkImg(p.perk)}${styleImg(p.sub)}</div>
          <div class="who"><b>${esc(p.name || champName(p.c))}</b><span>${esc(champName(p.c))}${p.tag ? " #" + esc(p.tag) : ""}</span></div>
          <div class="score"><b class="${p.score >= 7 ? "c-gold" : ""}">${p.score.toFixed(1)}</b>${p.badge ? `<div><span class="badge ${p.badge.toLowerCase()}">${p.badge}</span></div>` : ""}</div>
          <div class="cell num">${p.k} / <span class="d">${p.d}</span> / ${p.a}<small>${((p.k + p.a) / Math.max(p.d, 1)).toFixed(2)} · 参团 ${pct(p.kp)}%</small></div>
          <div class="cell num" style="text-align:left">${p.dmg.toLocaleString()}<div class="bar2"><div style="width:${p.dmg / maxDmg * 100}%"></div></div></div>
          <div class="cell num">${(p.gold / 1000).toFixed(1)}k</div>
          <div class="cell num">${p.cs}<small>${(p.cs / min).toFixed(1)}/分</small></div>
          <div class="cell num">${p.vis}</div>
          <div class="items">${(p.items || []).map(id => id ? itemImg(id) : '<div class="ph"></div>').join("")}</div></div>`).join("")}</div>`;
    };
    inner = `<div class="mhead"><h2 class="${me ? (me.win ? "c-good" : "c-bad") : ""}">${me ? (me.win ? "胜利" : "失败") : "对局详情"}</h2>
        <span>${esc(QUEUES[d.q] || "其他")} · ${Math.round(d.dur / 60)} 分钟 · ${new Date(d.t).toLocaleString("zh-CN")}</span>
        <span>评分综合 KDA、参团、伤害、经济、视野、补刀（参考 OP Score 思路，本程序自行计算）</span>${close}</div>
      <div class="mbody">${d.teams.map(side).join("")}</div>`;
  }
  return `<div class="scrim top${enter}" data-close="modal"></div><div class="modal${enter}">${inner}</div>`;
}

/* ---------------- 渲染 ---------------- */
function render() {
  if (!state) return;
  $("#led").className = "led " + (state.connected ? "ok" : "bad");
  $("#status").innerHTML = [state.phase && `<b>${esc(state.phase)}</b>`, esc(state.status)].filter(Boolean).join(" · ");
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  document.querySelectorAll(".tools .seg").forEach(s => s.style.display = s.dataset.for.split(" ").includes(tab) ? "" : "none");
  document.querySelectorAll("#count button").forEach(b => b.classList.toggle("on", +b.dataset.v === state.settings.games));
  document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b.dataset.v === mode));
  document.querySelectorAll("#otier button").forEach(b => b.classList.toggle("on", b.dataset.v === otier));
  $("#pin").classList.toggle("on", !!state.settings.topmost);
  $("#winctl").style.display = state.native ? "" : "none";

  // 记住滚动位置和搜索框光标，重画后恢复
  const scrolls = {};
  document.querySelectorAll("[data-scroll]").forEach(el => scrolls[el.dataset.scroll] = el.scrollTop);
  const typing = document.activeElement?.id === "csearch";
  const caret = typing ? document.activeElement.selectionStart : 0;

  $("#main").innerHTML = tab === "team" ? teamView() : tab === "me" ? meView() : tab === "build" ? buildView() : tierView();
  $("#overlay").innerHTML = gameModal();
  document.querySelectorAll("[data-scroll]").forEach(el => { if (scrolls[el.dataset.scroll]) el.scrollTop = scrolls[el.dataset.scroll]; });
  if (typing) { const s = $("#csearch"); s.focus(); s.setSelectionRange(caret, caret); }
  (state.players || []).forEach(p => { if (!p.loading) seen.add(p.key); });
}

async function post(path, body = {}) {
  try { await api(path, { method: "POST", body: JSON.stringify(body) }); } catch (e) {}
  poll();
}
async function loadAssets() {
  try { assets = await getJSON("/api/assets"); render(); } catch (e) { assetsFor = null; }
}
async function poll() {
  try {
    state = await (await api("/api/state")).json();
  } catch (e) {
    $("#status").textContent = "后台程序已退出";
    $("#led").className = "led bad";
    return;
  }
  if (assetsFor !== state.connected) { assetsFor = state.connected; loadAssets(); }
  if (state.phase === "选英雄中" && lastPhase !== "选英雄中") {
    B.auto = true; B.autoKey = null;  // 每局重新开启自动推荐（上一局手动换过英雄也一样）
    if (tab === "me") setTab("team");
  }
  lastPhase = state.phase;
  // 选英雄时，我的英雄、位置或对面阵容变了：自动刷新出装和对位
  const pk = JSON.stringify(state.pick || {});
  if (state.pick?.champ && pk !== B.autoKey) { B.autoKey = pk; if (B.auto) autoBuild(); }
  const key = [state.version, mode, selected, tab].join("|");
  if (key !== lastKey) { lastKey = key; render(); }
}
function setTab(t) {
  tab = t; store.set("tab", t);
  if (t === "me" && state && state.view !== "self") post("/api/self");
  if (t === "team" && state?.view === "self" && state.phase === "选英雄中") post("/api/team");
  if (t === "build" && !B.data && !B.loading) loadBuild();
  lastKey = ""; render();
}
function pickChamp(id, { pos = null, keepTarget = false } = {}) {
  B.champ = +id; store.set("bchamp", B.champ); B.pos = pos; B.auto = false;
  if (!keepTarget || B.target === B.champ) B.target = keepTarget ? B.target : null;
  if (B.target === B.champ) B.target = null;
  if (tab !== "build") { tab = "build"; store.set("tab", "build"); }
  loadBuild();
}

document.addEventListener("click", e => {
  const t = e.target;
  const nav = t.closest("[data-tab]");
  if (nav) { setTab(nav.dataset.tab); return; }
  const seg = t.closest(".seg button");
  if (seg?.parentElement.id === "mode") { mode = seg.dataset.v; store.set("mode", mode); lastKey = ""; render(); return; }
  if (seg?.parentElement.id === "count") { post("/api/settings", { games: +seg.dataset.v }); return; }
  if (seg?.parentElement.id === "otier") {
    otier = seg.dataset.v; store.set("otier", otier);
    if (tab === "build") loadBuild(); else render();
    return;
  }
  const win = t.closest("#winctl button");
  if (win) { post("/api/window", { action: win.dataset.a }); return; }
  const close = t.closest("[data-close]");
  if (close) { if (close.dataset.close === "modal") modal = null; else selected = null; render(); return; }
  const g = t.closest("[data-game]");
  if (g) { openGame(+g.dataset.game, g.dataset.focus); return; }
  const tgt = t.closest("[data-target]");
  if (tgt) { B.target = +tgt.dataset.target; B.auto = false; if (B.target === B.champ) B.target = null; loadBuild(); return; }
  const pick = t.closest("[data-pick]");
  if (pick) { pickChamp(pick.dataset.pick, { keepTarget: pick.hasAttribute("data-keep"), pos: pick.hasAttribute("data-keep") ? B.pos : null }); return; }
  const bld = t.closest("[data-build]");
  if (bld) { pickChamp(bld.dataset.build, { pos: bld.dataset.pos || null }); return; }
  const bpos = t.closest("[data-bpos]");
  if (bpos) { B.pos = bpos.dataset.bpos; B.target = null; loadBuild(); return; }
  const bmode = t.closest("[data-bmode]");
  if (bmode) { B.mode = bmode.dataset.bmode; loadBuild(); return; }
  if (t.closest("[data-retry]")) { loadBuild(); return; }
  if (t.closest("[data-tretry]")) { T.err = null; loadTiers(); return; }
  const rune = t.closest("[data-rune]");
  if (rune) { B.runeIdx = +rune.dataset.rune; render(); return; }
  if (t.closest("[data-import]")) { importRunes(); return; }
  const tpos = t.closest("[data-tpos]");
  if (tpos) { T.pos = tpos.dataset.tpos; store.set("tpos", T.pos); render(); return; }
  const tmode = t.closest("[data-tmode]");
  if (tmode) { T.mode = tmode.dataset.tmode; T.err = null; render(); return; }
  const c = t.closest(".card[data-key]");
  if (c) { selected = c.dataset.key; fresh.drawer = true; lastKey = ""; render(); }
});
document.addEventListener("input", e => { if (e.target.id === "csearch") { B.search = e.target.value; render(); } });
document.addEventListener("change", e => {
  if (e.target.id === "target") { B.target = e.target.value ? +e.target.value : null; B.auto = false; loadBuild(); }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (modal) modal = null; else if (selected) selected = null; else return;
  render();
});
async function importRunes() {
  const r = B.data?.runes?.[B.runeIdx];
  if (!r) return;
  const name = champName(B.champ) + (B.target ? " vs " + champName(B.target) : "");
  try {
    const res = await api("/api/runes", { method: "POST", body: JSON.stringify({
      name, primary: r.primary, secondary: r.secondary, perks: [...r.primaryRunes, ...r.secondaryRunes, ...(r.shards || [])] }) });
    const d = await res.json();
    toast(d.message || (d.ok ? "已导入" : "导入失败"), !d.ok);
  } catch (e) { toast("导入失败：" + e.message, true); }
}
$("#refresh").onclick = () => {
  if (tab === "build") { loadBuild(); return; }
  if (tab === "tier") { T.rows = null; T.err = null; render(); return; }
  post("/api/refresh");
};
$("#pin").onclick = () => post("/api/settings", { topmost: !state?.settings.topmost });

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
